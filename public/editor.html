            </div>

            <div class="modal-actions">
                <label style="margin-right:auto; font-size:0.85rem; display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                    <input type="checkbox" id="sigAllPages"> Apply to ALL pages
                </label>
                <button class="btn-modal-sec" id="sigUndoBtn">Undo Stroke</button>
                <button class="btn-modal-sec" id="clearSigBtn">Clear</button>
                <button class="btn-modal-sec" id="closeSigBtn">Cancel</button>
                <button class="btn-modal-pri" id="applySigBtn">Insert Signature</button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        lucide.createIcons();

        // ========== THEME TOGGLE ==========
        const themeBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlDoc = document.documentElement;

        function updateThemeIcon() {
            const isDark = htmlDoc.getAttribute('data-theme') === 'dark';
            if (isDark) {
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }
        updateThemeIcon();

        themeBtn.addEventListener('click', () => {
            const isDark = htmlDoc.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            htmlDoc.setAttribute('data-theme', next);
            localStorage.setItem('pdfsuite-theme', next);
            updateThemeIcon();
        });

        // ========== STATE ==========
        let pdfDoc = null;
        let originalPdfBytes = null;
        let originalFileName = 'Document.pdf';
        let currentPage = 1;
        let scale = 1.0;
        let currentTool = 'select';
        let selectedAnnoId = null;

        // Structured storage per page (coordinates always stored in UNZOOMED PDF points):
        // pageAnnotations[pageNum] = [ { id, type, x, y, width, height, ... } ]
        const pageAnnotations = {};
        // pageDrawings[pageNum] = [ { tool: 'pen'|'eraser', color, size, points: [{x, y}] } ]
        const pageDrawings = {};
        // Page viewports at scale 1.0
        const pageDimensions = {};

        // History for undo/redo
        const undoHistory = [];
        const redoHistory = [];

        function recordAction(action) {
            undoHistory.push(action);
            redoHistory.length = 0; // Clear redo
            updateUndoRedoBtns();
        }

        function updateUndoRedoBtns() {
            document.getElementById('undoBtn').disabled = undoHistory.length === 0;
            document.getElementById('redoBtn').disabled = redoHistory.length === 0;
        }
        updateUndoRedoBtns();

        // ========== DOM REFS ==========
        const fileInput = document.getElementById('fileInput');
        const uploadState = document.getElementById('uploadState');
        const canvasArea = document.getElementById('canvasArea');
        const editorBody = document.getElementById('editorBody');
        const pdfWrap = document.getElementById('pdfWrap');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const interactionCanvas = document.getElementById('interactionCanvas');
        const annotLayer = document.getElementById('annotationLayer');
        const exportBtn = document.getElementById('exportBtn');
        const pageNav = document.getElementById('pageNav');
        const editorToolbar = document.getElementById('editorToolbar');
        const pageInfo = document.getElementById('pageInfo');
        const docTitle = document.getElementById('docTitle');
        const thumbSidebar = document.getElementById('thumbSidebar');

        const pdfCtx = pdfCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');
        const interCtx = interactionCanvas.getContext('2d');

        // ========== LOAD PDF ==========
        uploadState.addEventListener('click', () => fileInput.click());
        uploadState.addEventListener('dragover', e => { e.preventDefault(); uploadState.style.borderColor = 'var(--accent)'; });
        uploadState.addEventListener('dragleave', () => { uploadState.style.borderColor = 'var(--border-subtle)'; });
        uploadState.addEventListener('drop', e => {
            e.preventDefault();
            uploadState.style.borderColor = 'var(--border-subtle)';
            const file = e.dataTransfer.files[0];
            if (file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
                loadPdf(file);
            }
        });

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        async function loadPdf(file) {
            originalFileName = file.name;
            originalPdfBytes = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(originalPdfBytes) }).promise;

            docTitle.textContent = originalFileName;
            docTitle.style.display = 'block';

            canvasArea.classList.add('editing');
            editorBody.classList.add('has-doc');
            pageNav.style.display = 'flex';
            editorToolbar.style.display = 'flex';
            exportBtn.disabled = false;

            // Compute ideal initial scale
            const firstPage = await pdfDoc.getPage(1);
            const firstVp = firstPage.getViewport({ scale: 1.0 });
            pageDimensions[1] = { width: firstVp.width, height: firstVp.height };
            const availW = canvasArea.clientWidth - 80;
            if (availW > 0 && firstVp.width > 0) {
                scale = Math.min(1.5, Math.max(0.6, parseFloat((availW / firstVp.width).toFixed(2))));
            } else {
                scale = 1.0;
            }
            updateZoomLabel();

            await pageTo(1);
            buildThumbnails();
            lucide.createIcons();
        }

        // ========== RENDER PAGE ==========
        let currentRenderTask = null;

        async function renderPage(num) {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(num);
            const vp = page.getViewport({ scale });

            pageDimensions[num] = { width: vp.width / scale, height: vp.height / scale };

            // High-DPI crisp rendering
            const dpr = window.devicePixelRatio || 1;
            pdfCanvas.width = Math.floor(vp.width * dpr);
            pdfCanvas.height = Math.floor(vp.height * dpr);
            pdfCanvas.style.width = Math.floor(vp.width) + 'px';
            pdfCanvas.style.height = Math.floor(vp.height) + 'px';

            drawCanvas.width = Math.floor(vp.width * dpr);
            drawCanvas.height = Math.floor(vp.height * dpr);
            drawCanvas.style.width = Math.floor(vp.width) + 'px';
            drawCanvas.style.height = Math.floor(vp.height) + 'px';

            interactionCanvas.width = Math.floor(vp.width * dpr);
            interactionCanvas.height = Math.floor(vp.height * dpr);
            interactionCanvas.style.width = Math.floor(vp.width) + 'px';
            interactionCanvas.style.height = Math.floor(vp.height) + 'px';

            annotLayer.style.width = Math.floor(vp.width) + 'px';
            annotLayer.style.height = Math.floor(vp.height) + 'px';

            pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            interCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (currentRenderTask) currentRenderTask.cancel();
            currentRenderTask = page.render({ canvasContext: pdfCtx, viewport: vp });
            await currentRenderTask.promise.catch(() => { });

            pageInfo.innerText = `${num} / ${pdfDoc.numPages}`;
            document.getElementById('prevPage').disabled = num <= 1;
            document.getElementById('nextPage').disabled = num >= pdfDoc.numPages;

            renderDrawings(num);
            renderAnnotations(num);
            highlightThumb(num);
        }

        async function pageTo(n) {
            currentPage = n;
            selectedAnnoId = null;
            await renderPage(n);
        }

        document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 1) pageTo(currentPage - 1); });
        document.getElementById('nextPage').addEventListener('click', () => { if (currentPage < pdfDoc.numPages) pageTo(currentPage + 1); });

        // ========== TOOL SWITCHING ==========
        const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
        toolBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                const tool = this.dataset.tool;
                if (tool === 'sign') {
                    openSigModal();
                    return;
                }
                setTool(tool);
            });
        });

        function setTool(tool) {
            currentTool = tool;
            toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));

            // Layer classes and interaction modes
            annotLayer.className = 'mode-' + tool;
            const isCanvasDrawing = ['draw', 'eraser', 'whiteout', 'redact', 'highlight', 'shape'].includes(tool);
            interactionCanvas.classList.toggle('active', isCanvasDrawing);

            // Contextual options visibility
            document.getElementById('optTextGroup').style.display = (tool === 'text' || tool === 'select') ? 'flex' : 'none';
            document.getElementById('optDrawGroup').style.display = (tool === 'draw') ? 'flex' : 'none';
            document.getElementById('optHighlightGroup').style.display = (tool === 'highlight') ? 'flex' : 'none';
            document.getElementById('optShapeGroup').style.display = (tool === 'shape') ? 'flex' : 'none';

            if (tool !== 'select') {
                deselectAnno();
            }
        }

        // ========== DRAW SIZE SLIDER ==========
        const drawSizeSlider = document.getElementById('drawSize');
        const drawSizeVal = document.getElementById('drawSizeVal');
        drawSizeSlider.addEventListener('input', () => {
            drawSizeVal.textContent = drawSizeSlider.value + 'px';
        });

        // ========== RENDER DRAWINGS ==========
        function renderDrawings(num) {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            const strokes = pageDrawings[num] || [];
            strokes.forEach(s => {
                if (!s.points || s.points.length === 0) return;
                drawCtx.save();
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                if (s.tool === 'eraser') {
                    drawCtx.globalCompositeOperation = 'destination-out';
                    drawCtx.lineWidth = (s.size || 15) * scale;
                } else {
                    drawCtx.globalCompositeOperation = 'source-over';
                    drawCtx.strokeStyle = s.color || '#ef4444';
                    drawCtx.lineWidth = (s.size || 3) * scale;
                }

                drawCtx.beginPath();
                drawCtx.moveTo(s.points[0].x * scale, s.points[0].y * scale);
                for (let i = 1; i < s.points.length; i++) {
                    drawCtx.lineTo(s.points[i].x * scale, s.points[i].y * scale);
                }
                drawCtx.stroke();
                drawCtx.restore();
            });
        }

        // ========== FREEHAND DRAW & INTERACTION CANVAS ==========
        let isInteracting = false;
        let activeStroke = null;
        let dragStartX = 0, dragStartY = 0;

        function getPdfCoords(e) {
            const rect = pdfCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
            const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
            return {
                screenX: x,
                screenY: y,
                pdfX: x / scale,
                pdfY: y / scale
            };
        }

        interactionCanvas.addEventListener('mousedown', startCanvasInteraction);
        interactionCanvas.addEventListener('touchstart', startCanvasInteraction, { passive: false });

        window.addEventListener('mousemove', moveCanvasInteraction);
        window.addEventListener('touchmove', moveCanvasInteraction, { passive: false });

        window.addEventListener('mouseup', endCanvasInteraction);
        window.addEventListener('touchend', endCanvasInteraction);

        function startCanvasInteraction(e) {
            if (e.target !== interactionCanvas) return;
            e.preventDefault();
            isInteracting = true;
            const pt = getPdfCoords(e);
            dragStartX = pt.pdfX;
            dragStartY = pt.pdfY;

            if (currentTool === 'draw' || currentTool === 'eraser') {
                activeStroke = {
                    tool: currentTool,
                    color: document.getElementById('drawColor').value,
                    size: parseInt(document.getElementById('drawSize').value) || 3,
                    points: [{ x: pt.pdfX, y: pt.pdfY }]
                };
            }
        }

        function moveCanvasInteraction(e) {
            if (!isInteracting) return;
            e.preventDefault();
            const pt = getPdfCoords(e);

            if (currentTool === 'draw' || currentTool === 'eraser') {
                activeStroke.points.push({ x: pt.pdfX, y: pt.pdfY });
                // Draw current segment live
                drawCtx.save();
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                if (activeStroke.tool === 'eraser') {
                    drawCtx.globalCompositeOperation = 'destination-out';
                    drawCtx.lineWidth = (activeStroke.size * 3) * scale;
                } else {
                    drawCtx.globalCompositeOperation = 'source-over';
                    drawCtx.strokeStyle = activeStroke.color;
                    drawCtx.lineWidth = activeStroke.size * scale;
                }
                const pts = activeStroke.points;
                const len = pts.length;
                if (len >= 2) {
                    drawCtx.beginPath();
                    drawCtx.moveTo(pts[len - 2].x * scale, pts[len - 2].y * scale);
                    drawCtx.lineTo(pts[len - 1].x * scale, pts[len - 1].y * scale);
                    drawCtx.stroke();
                }
                drawCtx.restore();
            } else if (['whiteout', 'redact', 'highlight', 'shape'].includes(currentTool)) {
                // Live drag preview on interaction canvas
                interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
                const x = Math.min(dragStartX, pt.pdfX) * scale;
                const y = Math.min(dragStartY, pt.pdfY) * scale;
                const w = Math.abs(pt.pdfX - dragStartX) * scale;
                const h = Math.abs(pt.pdfY - dragStartY) * scale;

                interCtx.save();
                if (currentTool === 'whiteout') {
                    interCtx.fillStyle = '#ffffff';
                    interCtx.strokeStyle = '#94a3b8';
                    interCtx.lineWidth = 1;
                    interCtx.fillRect(x, y, w, h);
                    interCtx.strokeRect(x, y, w, h);
                } else if (currentTool === 'redact') {
                    interCtx.fillStyle = '#000000';
                    interCtx.fillRect(x, y, w, h);
                } else if (currentTool === 'highlight') {
                    interCtx.fillStyle = document.getElementById('hlColor').value + '66';
                    interCtx.fillRect(x, y, w, h);
                } else if (currentTool === 'shape') {
                    const st = document.getElementById('shapeType').value;
                    const strokeCol = document.getElementById('shapeStrokeColor').value;
                    const fillCol = document.getElementById('shapeFillColor').value;
                    const noFill = document.getElementById('shapeTransparentFill').checked;
                    const strokeW = (parseInt(document.getElementById('shapeWidth').value) || 2) * scale;

                    interCtx.strokeStyle = strokeCol;
                    interCtx.lineWidth = strokeW;
                    if (!noFill) interCtx.fillStyle = fillCol;

                    if (st === 'rect') {
                        if (!noFill) interCtx.fillRect(x, y, w, h);
                        interCtx.strokeRect(x, y, w, h);
                    } else if (st === 'circle') {
                        interCtx.beginPath();
                        interCtx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
                        if (!noFill) interCtx.fill();
                        interCtx.stroke();
                    } else if (st === 'line' || st === 'arrow') {
                        interCtx.beginPath();
                        interCtx.moveTo(dragStartX * scale, dragStartY * scale);
                        interCtx.lineTo(pt.pdfX * scale, pt.pdfY * scale);
                        interCtx.stroke();
                    }
                }
                interCtx.restore();
            }
        }

        function endCanvasInteraction(e) {
            if (!isInteracting) return;
            isInteracting = false;
            interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);

            if (currentTool === 'draw' || currentTool === 'eraser') {
                if (activeStroke && activeStroke.points.length > 1) {
                    if (!pageDrawings[currentPage]) pageDrawings[currentPage] = [];
                    pageDrawings[currentPage].push(activeStroke);
                    recordAction({
                        type: 'draw_stroke',
                        page: currentPage,
                        stroke: activeStroke
                    });
                }
                activeStroke = null;
                renderDrawings(currentPage);
            } else if (['whiteout', 'redact', 'highlight', 'shape'].includes(currentTool)) {
                const pt = getPdfCoords(e);
                const x = Math.min(dragStartX, pt.pdfX);
                const y = Math.min(dragStartY, pt.pdfY);
                const w = Math.abs(pt.pdfX - dragStartX);
                const h = Math.abs(pt.pdfY - dragStartY);

                // Ignore accidental tiny clicks
                if (w > 5 && h > 5) {
                    let newAnno = null;
                    const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

                    if (currentTool === 'whiteout') {
                        newAnno = { id, type: 'whiteout', x, y, width: w, height: h, color: '#ffffff' };
                    } else if (currentTool === 'redact') {
                        newAnno = { id, type: 'redact', x, y, width: w, height: h, color: '#000000' };
                    } else if (currentTool === 'highlight') {
                        newAnno = { id, type: 'highlight', x, y, width: w, height: h, color: document.getElementById('hlColor').value, opacity: 0.35 };
                    } else if (currentTool === 'shape') {
                        const st = document.getElementById('shapeType').value;
                        newAnno = {
                            id,
                            type: st === 'circle' ? 'circle' : (st === 'line' || st === 'arrow' ? 'line' : 'rect'),
                            x, y, width: w, height: h,
                            strokeColor: document.getElementById('shapeStrokeColor').value,
                            fillColor: document.getElementById('shapeTransparentFill').checked ? 'transparent' : document.getElementById('shapeFillColor').value,
                            strokeWidth: parseInt(document.getElementById('shapeWidth').value) || 2,
                            isArrow: st === 'arrow'
                        };
                    }

                    if (newAnno) {
                        addAnnotation(currentPage, newAnno);
                        setTool('select');
                        selectAnno(newAnno.id);
                    }
                }
            }
        }

        // ========== TEXT CLICK TO ADD ==========
        annotLayer.addEventListener('click', function (e) {
            if (currentTool !== 'text') return;
            if (e.target !== annotLayer) return;
            const pt = getPdfCoords(e);
            const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const fs = parseInt(document.getElementById('fontSize').value) || 16;
            const col = document.getElementById('textColor').value;
            const fam = document.getElementById('fontFamily').value;
            const bold = document.getElementById('btnBold').classList.contains('active');
            const ital = document.getElementById('btnItalic').classList.contains('active');

            const newAnno = {
                id,
                type: 'text',
                x: pt.pdfX,
                y: pt.pdfY,
                width: 140,
                height: Math.max(28, fs * 1.5),
                text: 'Type text here...',
                fontSize: fs,
                fontFamily: fam,
                bold,
                italic: ital,
                color: col,
                align: 'left'
            };

            addAnnotation(currentPage, newAnno);
            setTool('select');
            selectAnno(newAnno.id);

            // Focus contenteditable text
            setTimeout(() => {
                const el = document.getElementById(newAnno.id);
                if (el) {
                    const inner = el.querySelector('.anno-text-inner');
                    if (inner) {
                        inner.focus();
                        selectAllText(inner);
                    }
                }
            }, 50);
        });

        function selectAllText(el) {
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // ========== ANNOTATIONS DATA STORE ==========
        function addAnnotation(pageNum, anno) {
            if (!pageAnnotations[pageNum]) pageAnnotations[pageNum] = [];
            pageAnnotations[pageNum].push(anno);
            recordAction({ type: 'add_anno', page: pageNum, anno });
            renderAnnotations(pageNum);
        }

        function removeAnnotation(pageNum, annoId) {
            const list = pageAnnotations[pageNum];
            if (!list) return;
            const idx = list.findIndex(a => a.id === annoId);
            if (idx !== -1) {
                const removed = list.splice(idx, 1)[0];
                recordAction({ type: 'remove_anno', page: pageNum, anno: removed, index: idx });
                if (selectedAnnoId === annoId) selectedAnnoId = null;
                renderAnnotations(pageNum);
            }
        }

        function getAnno(annoId) {
            for (let p in pageAnnotations) {
                const a = pageAnnotations[p].find(x => x.id === annoId);
                if (a) return a;
            }
            return null;
        }

        // ========== RENDER ANNOTATIONS DOM ==========
        function renderAnnotations(pageNum) {
            annotLayer.innerHTML = '';
            const list = pageAnnotations[pageNum] || [];

            list.forEach(item => {
                const wrap = document.createElement('div');
                wrap.id = item.id;
                wrap.className = 'anno-item' + (item.id === selectedAnnoId ? ' selected' : '');
                wrap.style.left = (item.x * scale) + 'px';
                wrap.style.top = (item.y * scale) + 'px';
                wrap.style.width = (item.width * scale) + 'px';
                wrap.style.height = (item.height * scale) + 'px';

                // Inner content by type
                if (item.type === 'text') {
                    wrap.classList.add('anno-text-box');
                    const inner = document.createElement('div');
                    inner.className = 'anno-text-inner';
                    inner.contentEditable = true;
                    inner.innerText = item.text || '';
                    inner.style.fontSize = (item.fontSize * scale) + 'px';
                    inner.style.color = item.color || '#000';
                    inner.style.fontFamily = getFontFamilyCss(item.fontFamily);
                    inner.style.fontWeight = item.bold ? '700' : '400';
                    inner.style.fontStyle = item.italic ? 'italic' : 'normal';
                    inner.style.textAlign = item.align || 'left';

                    inner.addEventListener('input', () => {
                        item.text = inner.innerText;
                    });
                    inner.addEventListener('focus', () => {
                        selectAnno(item.id);
                    });
                    wrap.appendChild(inner);
                } else if (item.type === 'whiteout') {
                    wrap.classList.add('anno-whiteout');
                } else if (item.type === 'redact') {
                    wrap.classList.add('anno-redact');
                } else if (item.type === 'highlight') {
                    wrap.classList.add('anno-highlight');
                    wrap.style.background = (item.color || '#facc15') + '66';
                } else if (item.type === 'rect') {
                    wrap.classList.add('anno-shape-rect');
                    wrap.style.border = `${(item.strokeWidth || 2) * scale}px solid ${item.strokeColor || '#2563eb'}`;
                    wrap.style.background = item.fillColor || 'transparent';
                } else if (item.type === 'circle') {
                    wrap.classList.add('anno-shape-circle');
                    wrap.style.border = `${(item.strokeWidth || 2) * scale}px solid ${item.strokeColor || '#2563eb'}`;
                    wrap.style.background = item.fillColor || 'transparent';
                } else if (item.type === 'line') {
                    wrap.style.borderTop = `${(item.strokeWidth || 2) * scale}px solid ${item.strokeColor || '#2563eb'}`;
                } else if (item.type === 'image') {
                    wrap.classList.add('anno-image');
                    const img = document.createElement('img');
                    img.src = item.dataUrl;
                    img.draggable = false;
                    wrap.appendChild(img);
                }

                // Add 8 resize handles
                ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(pos => {
                    const h = document.createElement('div');
                    h.className = `anno-handle ${pos}`;
                    h.dataset.handle = pos;
                    wrap.appendChild(h);
                });

                // Action Bar (Delete & Duplicate)
                const actBar = document.createElement('div');
                actBar.className = 'anno-actions-bar';
                actBar.innerHTML = `
                    <button class="anno-btn btn-dup" title="Duplicate"><i data-lucide="copy" style="width:12px;height:12px"></i></button>
                    <button class="anno-btn btn-del" title="Delete"><i data-lucide="trash-2" style="width:12px;height:12px"></i></button>
                `;
                actBar.querySelector('.btn-del').onclick = (e) => {
                    e.stopPropagation();
                    removeAnnotation(pageNum, item.id);
                };
                actBar.querySelector('.btn-dup').onclick = (e) => {
                    e.stopPropagation();
                    duplicateAnno(item);
                };
                wrap.appendChild(actBar);

                makeSelectableAndMovable(wrap, item);
                annotLayer.appendChild(wrap);
            });

            lucide.createIcons({ root: annotLayer });
        }

        function getFontFamilyCss(fam) {
            if (fam === 'Times') return "'Times New Roman', Times, serif";
            if (fam === 'Courier') return "'Courier New', Courier, monospace";
            return "'Inter', system-ui, -apple-system, sans-serif";
        }

        function selectAnno(id) {
            selectedAnnoId = id;
            document.querySelectorAll('.anno-item').forEach(el => {
                el.classList.toggle('selected', el.id === id);
            });
            const item = getAnno(id);
            if (item && item.type === 'text') {
                document.getElementById('fontSize').value = item.fontSize || 16;
                document.getElementById('fontFamily').value = item.fontFamily || 'Helvetica';
                document.getElementById('textColor').value = item.color || '#000000';
                document.getElementById('btnBold').classList.toggle('active', !!item.bold);
                document.getElementById('btnItalic').classList.toggle('active', !!item.italic);
            }
        }

        function deselectAnno() {
            selectedAnnoId = null;
            document.querySelectorAll('.anno-item').forEach(el => el.classList.remove('selected'));
        }

        function duplicateAnno(item) {
            const clone = JSON.parse(JSON.stringify(item));
            clone.id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            clone.x += 15;
            clone.y += 15;
            addAnnotation(currentPage, clone);
            selectAnno(clone.id);
        }

        // Deselect when clicking outside
        annotLayer.addEventListener('mousedown', function (e) {
            if (e.target === annotLayer && currentTool === 'select') {
                deselectAnno();
            }
        });

        // ========== DRAGGING & RESIZING ANNOTATIONS ==========
        function makeSelectableAndMovable(el, item) {
            let mode = null; // 'move' or handle position 'nw', 'se', etc.
            let startClientX = 0, startClientY = 0;
            let origX = 0, origY = 0, origW = 0, origH = 0;

            el.addEventListener('mousedown', onPointerDown);
            el.addEventListener('touchstart', onPointerDown, { passive: false });

            function onPointerDown(e) {
                if (currentTool !== 'select' && currentTool !== 'text') return;
                // If user is clicking directly into text to edit, don't drag
                if (e.target.classList.contains('anno-text-inner') && e.type === 'mousedown') {
                    selectAnno(item.id);
                    return;
                }
                if (e.target.closest('.anno-actions-bar')) return;

                e.stopPropagation();
                selectAnno(item.id);

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                if (e.target.classList.contains('anno-handle')) {
                    mode = e.target.dataset.handle;
                } else {
                    mode = 'move';
                }

                startClientX = clientX;
                startClientY = clientY;
                origX = item.x;
                origY = item.y;
                origW = item.width;
                origH = item.height;

                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('touchmove', onPointerMove, { passive: false });
                window.addEventListener('mouseup', onPointerUp);
                window.addEventListener('touchend', onPointerUp);
            }

            function onPointerMove(e) {
                if (!mode) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = (clientX - startClientX) / scale;
                const dy = (clientY - startClientY) / scale;

                if (mode === 'move') {
                    item.x = Math.max(0, origX + dx);
                    item.y = Math.max(0, origY + dy);
                    el.style.left = (item.x * scale) + 'px';
                    el.style.top = (item.y * scale) + 'px';
                } else {
                    // Resize via handle
                    let newX = origX;
                    let newY = origY;
                    let newW = origW;
                    let newH = origH;

                    if (mode.includes('e')) newW = Math.max(20, origW + dx);
                    if (mode.includes('s')) newH = Math.max(15, origH + dy);
                    if (mode.includes('w')) {
                        const candidateW = origW - dx;
                        if (candidateW > 20) {
                            newW = candidateW;
                            newX = origX + dx;
                        }
                    }
                    if (mode.includes('n')) {
                        const candidateH = origH - dy;
                        if (candidateH > 15) {
                            newH = candidateH;
                            newY = origY + dy;
                        }
                    }

                    item.x = newX;
                    item.y = newY;
                    item.width = newW;
                    item.height = newH;

                    el.style.left = (item.x * scale) + 'px';
                    el.style.top = (item.y * scale) + 'px';
                    el.style.width = (item.width * scale) + 'px';
                    el.style.height = (item.height * scale) + 'px';
                }
            }

            function onPointerUp() {
                if (mode) {
                    recordAction({
                        type: 'modify_anno',
                        page: currentPage,
                        id: item.id,
                        prev: { x: origX, y: origY, width: origW, height: origH },
                        curr: { x: item.x, y: item.y, width: item.width, height: item.height }
                    });
                }
                mode = null;
                window.removeEventListener('mousemove', onPointerMove);
                window.removeEventListener('touchmove', onPointerMove);
                window.removeEventListener('mouseup', onPointerUp);
                window.removeEventListener('touchend', onPointerUp);
            }
        }

        // ========== TOOLBAR OPTION EVENT LISTENERS ==========
        document.getElementById('fontSize').addEventListener('input', function () {
            const fs = parseInt(this.value) || 16;
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'text') {
                    item.fontSize = fs;
                    renderAnnotations(currentPage);
                }
            }
        });

        document.getElementById('fontFamily').addEventListener('change', function () {
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'text') {
                    item.fontFamily = this.value;
                    renderAnnotations(currentPage);
                }
            }
        });

        document.getElementById('textColor').addEventListener('input', function () {
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'text') {
                    item.color = this.value;
                    renderAnnotations(currentPage);
                }
            }
        });

        document.getElementById('btnBold').addEventListener('click', function () {
            this.classList.toggle('active');
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'text') {
                    item.bold = this.classList.contains('active');
                    renderAnnotations(currentPage);
                }
            }
        });

        document.getElementById('btnItalic').addEventListener('click', function () {
            this.classList.toggle('active');
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'text') {
                    item.italic = this.classList.contains('active');
                    renderAnnotations(currentPage);
                }
            }
        });

        document.getElementById('hlColor').addEventListener('input', function () {
            if (selectedAnnoId) {
                const item = getAnno(selectedAnnoId);
                if (item && item.type === 'highlight') {
                    item.color = this.value;
                    renderAnnotations(currentPage);
                }
            }
        });

        // ========== DIRECT IMAGE INSERTION ==========
        document.getElementById('insertImageBtn').addEventListener('click', () => {
            document.getElementById('directImageInput').click();
        });

        document.getElementById('directImageInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const aspect = img.width / img.height;
                    const w = Math.min(220, img.width);
                    const h = w / aspect;
                    const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                    const anno = {
                        id,
                        type: 'image',
                        x: 60,
                        y: 60,
                        width: w,
                        height: h,
                        dataUrl: ev.target.result
                    };
                    addAnnotation(currentPage, anno);
                    setTool('select');
                    selectAnno(anno.id);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        // ========== SIGNATURE MODAL ==========
        const sigModal = document.getElementById('sigModal');
        const sigCanvas = document.getElementById('sigCanvas');
        const sigCtx = sigCanvas.getContext('2d');
        let isSigning = false, sigLastX = 0, sigLastY = 0;
        let sigStrokesHistory = [];
        let currentSigTab = 'draw';
        let currentSigFont = 'Dancing Script';
        let uploadedSigImg = null;

        function openSigModal() {
            sigModal.classList.add('open');
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            sigStrokesHistory = [];
            resetUploadState();
            switchSigTab('draw');
        }

        function switchSigTab(tab) {
            currentSigTab = tab;
            document.getElementById('sigPaneDraw').style.display = tab === 'draw' ? 'block' : 'none';
            document.getElementById('sigPaneType').style.display = tab === 'type' ? 'block' : 'none';
            document.getElementById('sigPaneUpload').style.display = tab === 'upload' ? 'block' : 'none';

            ['draw', 'type', 'upload'].forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                btn.style.background = (t === tab) ? 'var(--accent)' : 'transparent';
                btn.style.color = (t === tab) ? '#fff' : 'var(--fg)';
            });

            document.getElementById('sigUndoBtn').style.display = tab === 'draw' ? 'inline-flex' : 'none';
        }

        function setSigFont(font) {
            currentSigFont = font;
            renderTypedSig();
        }

        function renderTypedSig() {
            const canvas = document.getElementById('sigTypePreview');
            const ctx = canvas.getContext('2d');
            const text = document.getElementById('sigTypeInput').value || 'Your Signature';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111';
            ctx.font = `52px '${currentSigFont}', cursive, serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        }

        document.getElementById('sigTypeInput').addEventListener('input', renderTypedSig);

        // Upload signature photo
        document.getElementById('sigFileInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                uploadedSigImg = new Image();
                uploadedSigImg.onload = () => {
                    document.getElementById('sigUploadBox').style.display = 'none';
                    document.getElementById('sigUploadControls').style.display = 'block';
                    renderUploadedSig();
                };
                uploadedSigImg.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('sigRemoveBg').addEventListener('change', () => {
            document.getElementById('sigRemoveBgOptions').style.display = document.getElementById('sigRemoveBg').checked ? 'block' : 'none';
            if (uploadedSigImg) renderUploadedSig();
        });
        document.getElementById('sigBgTolerance').addEventListener('input', () => { if (uploadedSigImg) renderUploadedSig(); });
        document.getElementById('sigMakeBlack').addEventListener('change', () => { if (uploadedSigImg) renderUploadedSig(); });

        function renderUploadedSig() {
            const canvas = document.getElementById('sigUploadPreview');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = uploadedSigImg.naturalWidth;
            canvas.height = uploadedSigImg.naturalHeight;
            canvas.style.maxHeight = '150px';
            canvas.style.objectFit = 'contain';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(uploadedSigImg, 0, 0);

            if (document.getElementById('sigRemoveBg').checked) {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const tol = parseInt(document.getElementById('sigBgTolerance').value) || 180;
                const makeBlack = document.getElementById('sigMakeBlack').checked;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    const brightness = (r + g + b) / 3;
                    if (brightness > tol) {
                        data[i + 3] = 0; // Transparent
                    } else if (makeBlack) {
                        data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
                        data[i + 3] = Math.max(0, Math.min(255, 255 - ((brightness / tol) * 255)));
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }
        }

        function resetUploadState() {
            uploadedSigImg = null;
            document.getElementById('sigFileInput').value = '';
            document.getElementById('sigUploadBox').style.display = 'block';
            document.getElementById('sigUploadControls').style.display = 'none';
            const c = document.getElementById('sigUploadPreview');
            c.getContext('2d').clearRect(0, 0, c.width, c.height);
        }

        document.getElementById('closeSigBtn').addEventListener('click', () => sigModal.classList.remove('open'));
        document.getElementById('clearSigBtn').addEventListener('click', () => {
            if (currentSigTab === 'draw') {
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
                sigStrokesHistory = [];
            } else if (currentSigTab === 'upload') {
                resetUploadState();
            } else if (currentSigTab === 'type') {
                document.getElementById('sigTypeInput').value = '';
                renderTypedSig();
            }
        });

        document.getElementById('sigUndoBtn').addEventListener('click', () => {
            sigStrokesHistory.pop();
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            sigStrokesHistory.forEach(stroke => {
                sigCtx.strokeStyle = stroke.color;
                sigCtx.lineWidth = 2.5;
                sigCtx.lineCap = 'round';
                sigCtx.lineJoin = 'round';
                sigCtx.beginPath();
                sigCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    sigCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                sigCtx.stroke();
            });
        });

        // Signature Canvas Drawing
        let activeSigStroke = null;
        function getSigCanvasPos(e) {
            const r = sigCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - r.left) * (sigCanvas.width / r.width),
                y: (clientY - r.top) * (sigCanvas.height / r.height)
            };
        }

        sigCanvas.addEventListener('mousedown', e => {
            isSigning = true;
            const p = getSigCanvasPos(e);
            activeSigStroke = { color: document.getElementById('sigInkColor').value, points: [p] };
            sigLastX = p.x; sigLastY = p.y;
        });
        sigCanvas.addEventListener('mousemove', e => {
            if (!isSigning || !activeSigStroke) return;
            const p = getSigCanvasPos(e);
            activeSigStroke.points.push(p);
            sigCtx.strokeStyle = activeSigStroke.color;
            sigCtx.lineWidth = 2.5;
            sigCtx.lineCap = 'round';
            sigCtx.beginPath();
            sigCtx.moveTo(sigLastX, sigLastY);
            sigCtx.lineTo(p.x, p.y);
            sigCtx.stroke();
            sigLastX = p.x; sigLastY = p.y;
        });
        window.addEventListener('mouseup', () => {
            if (isSigning && activeSigStroke) {
                sigStrokesHistory.push(activeSigStroke);
                activeSigStroke = null;
            }
            isSigning = false;
        });

        // Touch for signature canvas
        sigCanvas.addEventListener('touchstart', e => {
            e.preventDefault();
            isSigning = true;
            const p = getSigCanvasPos(e);
            activeSigStroke = { color: document.getElementById('sigInkColor').value, points: [p] };
            sigLastX = p.x; sigLastY = p.y;
        }, { passive: false });
        sigCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (!isSigning || !activeSigStroke) return;
            const p = getSigCanvasPos(e);
            activeSigStroke.points.push(p);
            sigCtx.strokeStyle = activeSigStroke.color;
            sigCtx.lineWidth = 2.5;
            sigCtx.lineCap = 'round';
            sigCtx.beginPath();
            sigCtx.moveTo(sigLastX, sigLastY);
            sigCtx.lineTo(p.x, p.y);
            sigCtx.stroke();
            sigLastX = p.x; sigLastY = p.y;
        }, { passive: false });
        window.addEventListener('touchend', () => {
            if (isSigning && activeSigStroke) {
                sigStrokesHistory.push(activeSigStroke);
                activeSigStroke = null;
            }
            isSigning = false;
        });

        // Insert Signature
        document.getElementById('applySigBtn').addEventListener('click', () => {
            let dataUrl = null;
            if (currentSigTab === 'draw') {
                if (sigStrokesHistory.length === 0) {
                    alert('Please draw your signature first.');
                    return;
                }
                dataUrl = sigCanvas.toDataURL('image/png');
            } else if (currentSigTab === 'type') {
                renderTypedSig();
                dataUrl = document.getElementById('sigTypePreview').toDataURL('image/png');
            } else if (currentSigTab === 'upload') {
                const c = document.getElementById('sigUploadPreview');
                if (!uploadedSigImg) {
                    alert('Please upload a signature photo first.');
                    return;
                }
                dataUrl = c.toDataURL('image/png');
            }

            if (!dataUrl) return;
            const toAllPages = document.getElementById('sigAllPages').checked;
            sigModal.classList.remove('open');

            const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const anno = {
                id,
                type: 'image',
                x: 60,
                y: 60,
                width: 160,
                height: 70,
                dataUrl
            };

            if (toAllPages && pdfDoc) {
                for (let p = 1; p <= pdfDoc.numPages; p++) {
                    const clone = JSON.parse(JSON.stringify(anno));
                    clone.id = 'anno_' + Date.now() + '_' + p + '_' + Math.random().toString(36).substr(2, 5);
                    addAnnotation(p, clone);
                }
            } else {
                addAnnotation(currentPage, anno);
            }

            setTool('select');
            selectAnno(anno.id);
            document.getElementById('sigAllPages').checked = false;
        });

        // ========== ZOOM CONTROLS ==========
        document.getElementById('zoomIn').addEventListener('click', () => {
            scale = Math.min(3.0, parseFloat((scale + 0.15).toFixed(2)));
            updateZoom();
        });
        document.getElementById('zoomOut').addEventListener('click', () => {
            scale = Math.max(0.4, parseFloat((scale - 0.15).toFixed(2)));
            updateZoom();
        });
        document.getElementById('fitWidthBtn').addEventListener('click', () => {
            const curDim = pageDimensions[currentPage];
            if (curDim && curDim.width > 0) {
                const availW = canvasArea.clientWidth - 80;
                scale = Math.min(2.5, Math.max(0.4, parseFloat((availW / curDim.width).toFixed(2))));
                updateZoom();
            }
        });

        function updateZoomLabel() {
            document.getElementById('zoomLabel').innerText = Math.round(scale * 100) + '%';
        }

        function updateZoom() {
            updateZoomLabel();
            renderPage(currentPage);
        }

        // ========== UNDO / REDO ==========
        document.getElementById('undoBtn').addEventListener('click', performUndo);
        document.getElementById('redoBtn').addEventListener('click', performRedo);

        function performUndo() {
            const action = undoHistory.pop();
            if (!action) return;
            redoHistory.push(action);

            if (action.type === 'add_anno') {
                const list = pageAnnotations[action.page] || [];
                const idx = list.findIndex(a => a.id === action.anno.id);
                if (idx !== -1) list.splice(idx, 1);
            } else if (action.type === 'remove_anno') {
                if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
                pageAnnotations[action.page].splice(action.index, 0, action.anno);
            } else if (action.type === 'modify_anno') {
                const item = getAnno(action.id);
                if (item) {
                    Object.assign(item, action.prev);
                }
            } else if (action.type === 'draw_stroke') {
                const strokes = pageDrawings[action.page];
                if (strokes && strokes.length > 0) strokes.pop();
            }

            updateUndoRedoBtns();
            renderPage(currentPage);
        }

        function performRedo() {
            const action = redoHistory.pop();
            if (!action) return;
            undoHistory.push(action);

            if (action.type === 'add_anno') {
                if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
                pageAnnotations[action.page].push(action.anno);
            } else if (action.type === 'remove_anno') {
                const list = pageAnnotations[action.page] || [];
                const idx = list.findIndex(a => a.id === action.anno.id);
                if (idx !== -1) list.splice(idx, 1);
            } else if (action.type === 'modify_anno') {
                const item = getAnno(action.id);
                if (item) {
                    Object.assign(item, action.curr);
                }
            } else if (action.type === 'draw_stroke') {
                if (!pageDrawings[action.page]) pageDrawings[action.page] = [];
                pageDrawings[action.page].push(action.stroke);
            }

            updateUndoRedoBtns();
            renderPage(currentPage);
        }

        // ========== DELETE & CLEAR ==========
        document.getElementById('deleteBtn').addEventListener('click', deleteSelected);

        function deleteSelected() {
            if (selectedAnnoId) {
                removeAnnotation(currentPage, selectedAnnoId);
            }
        }

        document.getElementById('clearPageBtn').addEventListener('click', () => {
            if (confirm('Clear all annotations and drawings on this page?')) {
                pageAnnotations[currentPage] = [];
                pageDrawings[currentPage] = [];
                selectedAnnoId = null;
                renderPage(currentPage);
            }
        });

        // ========== KEYBOARD SHORTCUTS ==========
        window.addEventListener('keydown', e => {
            // If typing in input or textarea
            const isEditingText = e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

            if ((e.key === 'Delete' || e.key === 'Backspace') && !isEditingText) {
                if (selectedAnnoId) {
                    e.preventDefault();
                    deleteSelected();
                }
            } else if (e.key === 'Escape') {
                deselectAnno();
                setTool('select');
            } else if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') {
                    if (e.shiftKey) {
                        e.preventDefault();
                        performRedo();
                    } else if (!isEditingText) {
                        e.preventDefault();
                        performUndo();
                    }
                } else if ((e.key === 'y' || e.key === 'Y') && !isEditingText) {
                    e.preventDefault();
                    performRedo();
                } else if ((e.key === 'd' || e.key === 'D') && selectedAnnoId && !isEditingText) {
                    e.preventDefault();
                    const item = getAnno(selectedAnnoId);
                    if (item) duplicateAnno(item);
                } else if (e.key === '=' || e.key === '+') {
                    e.preventDefault();
                    document.getElementById('zoomIn').click();
                } else if (e.key === '-') {
                    e.preventDefault();
                    document.getElementById('zoomOut').click();
                }
            }
        });

        // ========== THUMBNAILS ==========
        async function buildThumbnails() {
            thumbSidebar.innerHTML = '';
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const vp = page.getViewport({ scale: 0.18 });
                const tc = document.createElement('canvas');
                tc.width = vp.width;
                tc.height = vp.height;
                await page.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise;

                const item = document.createElement('div');
                item.className = 'thumb-item' + (i === 1 ? ' active' : '');
                item.dataset.page = i;
                const p = document.createElement('p');
                p.innerText = i;
                item.appendChild(tc);
                item.appendChild(p);
                item.addEventListener('click', () => { pageTo(i); });
                thumbSidebar.appendChild(item);
            }
        }

        function highlightThumb(n) {
            document.querySelectorAll('.thumb-item').forEach(t => {
                t.classList.toggle('active', parseInt(t.dataset.page) === n);
            });
        }

        // ========== EXPORT PDF WITH PDF-LIB ==========
        // Helper: convert characters outside WinAnsi to safe equivalents so pdf-lib never throws
        function sanitizeWinAnsi(str) {
            if (!str) return '';
            return str
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/[\u201C\u201D]/g, '"')
                .replace(/[\u2013\u2014]/g, '-')
                .replace(/[\u2022\u2023]/g, '*')
                .replace(/[\u2026]/g, '...')
                .replace(/[^\x00-\xFF]/g, ' '); // Strip non-latin1 if unsupported
        }

        function hexToRgb(hex) {
            if (!hex) return { r: 0, g: 0, b: 0 };
            const clean = hex.replace('#', '');
            const num = parseInt(clean, 16);
            if (clean.length === 6) {
                return {
                    r: ((num >> 16) & 255) / 255,
                    g: ((num >> 8) & 255) / 255,
                    b: (num & 255) / 255
                };
            }
            return { r: 0, g: 0, b: 0 };
        }

        exportBtn.addEventListener('click', async () => {
            if (!originalPdfBytes) return;
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> Exporting...';

            try {
                const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
                const pdfLibDoc = await PDFDocument.load(originalPdfBytes);

                // Pre-embed standard fonts
                const fonts = {
                    Helvetica: await pdfLibDoc.embedFont(StandardFonts.Helvetica),
                    HelveticaBold: await pdfLibDoc.embedFont(StandardFonts.HelveticaBold),
                    HelveticaOblique: await pdfLibDoc.embedFont(StandardFonts.HelveticaOblique),
                    HelveticaBoldOblique: await pdfLibDoc.embedFont(StandardFonts.HelveticaBoldOblique),
                    Times: await pdfLibDoc.embedFont(StandardFonts.TimesRoman),
                    TimesBold: await pdfLibDoc.embedFont(StandardFonts.TimesRomanBold),
                    TimesItalic: await pdfLibDoc.embedFont(StandardFonts.TimesRomanItalic),
                    TimesBoldItalic: await pdfLibDoc.embedFont(StandardFonts.TimesRomanBoldItalic),
                    Courier: await pdfLibDoc.embedFont(StandardFonts.Courier),
                    CourierBold: await pdfLibDoc.embedFont(StandardFonts.CourierBold),
                    CourierOblique: await pdfLibDoc.embedFont(StandardFonts.CourierOblique),
                    CourierBoldOblique: await pdfLibDoc.embedFont(StandardFonts.CourierBoldOblique)
                };

                const pages = pdfLibDoc.getPages();

                for (let p = 1; p <= pages.length; p++) {
                    const page = pages[p - 1];
                    const { width: pageWidth, height: pageHeight } = page.getSize();
                    const rotation = page.getRotation().angle || 0;

                    const annotations = pageAnnotations[p] || [];
                    const drawings = pageDrawings[p] || [];

                    // Coordinate converter for PDF space
                    function mapCoord(item) {
                        let x = item.x;
                        let y = item.y;
                        let w = item.width;
                        let h = item.height;

                        // Standard unrotated page
                        if (rotation === 0) {
                            return {
                                x: x,
                                y: pageHeight - y - h,
                                width: w,
                                height: h
                            };
                        } else if (rotation === 90) {
                            return {
                                x: y,
                                y: x,
                                width: h,
                                height: w
                            };
                        } else if (rotation === 180) {
                            return {
                                x: pageWidth - x - w,
                                y: y,
                                width: w,
                                height: h
                            };
                        } else if (rotation === 270) {
                            return {
                                x: pageWidth - y - h,
                                y: pageHeight - x - w,
                                width: h,
                                height: w
                            };
                        }
                        return { x, y: pageHeight - y - h, width: w, height: h };
                    }

                    // 1) WHITEOUT & REDACT (Draw first so they sit under new text/drawings)
                    for (const a of annotations) {
                        if (a.type === 'whiteout' || a.type === 'redact') {
                            const c = mapCoord(a);
                            const fill = a.type === 'whiteout' ? rgb(1, 1, 1) : rgb(0, 0, 0);
                            page.drawRectangle({
                                x: c.x,
                                y: c.y,
                                width: c.width,
                                height: c.height,
                                color: fill,
                                opacity: 1
                            });
                        }
                    }

                    // 2) SHAPES (Rectangles, Circles, Lines)
                    for (const a of annotations) {
                        if (a.type === 'rect' || a.type === 'circle' || a.type === 'line') {
                            const c = mapCoord(a);
                            const strk = hexToRgb(a.strokeColor);
                            const hasFill = a.fillColor && a.fillColor !== 'transparent';
                            const fColor = hasFill ? hexToRgb(a.fillColor) : undefined;

                            if (a.type === 'rect') {
                                page.drawRectangle({
                                    x: c.x,
                                    y: c.y,
                                    width: c.width,
                                    height: c.height,
                                    borderColor: rgb(strk.r, strk.g, strk.b),
                                    borderWidth: a.strokeWidth || 2,
                                    color: hasFill ? rgb(fColor.r, fColor.g, fColor.b) : undefined
                                });
                            } else if (a.type === 'circle') {
                                page.drawEllipse({
                                    x: c.x + c.width / 2,
                                    y: c.y + c.height / 2,
                                    xScale: c.width / 2,
                                    yScale: c.height / 2,
                                    borderColor: rgb(strk.r, strk.g, strk.b),
                                    borderWidth: a.strokeWidth || 2,
                                    color: hasFill ? rgb(fColor.r, fColor.g, fColor.b) : undefined
                                });
                            } else if (a.type === 'line') {
                                page.drawLine({
                                    start: { x: c.x, y: c.y + c.height },
                                    end: { x: c.x + c.width, y: c.y },
                                    color: rgb(strk.r, strk.g, strk.b),
                                    thickness: a.strokeWidth || 2
                                });
                            }
                        }
                    }

                    // 3) HIGHLIGHTS
                    for (const a of annotations) {
                        if (a.type === 'highlight') {
                            const c = mapCoord(a);
                            const hl = hexToRgb(a.color);
                            page.drawRectangle({
                                x: c.x,
                                y: c.y,
                                width: c.width,
                                height: c.height,
                                color: rgb(hl.r, hl.g, hl.b),
                                opacity: a.opacity || 0.35
                            });
                        }
                    }

                    // 4) FREEHAND DRAWINGS (Render vector strokes to high-res PNG canvas)
                    if (drawings.length > 0) {
                        const drawExportCanvas = document.createElement('canvas');
                        const resMult = 2; // High-res 144 DPI
                        drawExportCanvas.width = Math.floor(pageWidth * resMult);
                        drawExportCanvas.height = Math.floor(pageHeight * resMult);
                        const dCtx = drawExportCanvas.getContext('2d');
                        dCtx.scale(resMult, resMult);

                        drawings.forEach(s => {
                            if (!s.points || s.points.length === 0) return;
                            dCtx.save();
                            dCtx.lineCap = 'round';
                            dCtx.lineJoin = 'round';
                            if (s.tool === 'eraser') {
                                dCtx.globalCompositeOperation = 'destination-out';
                                dCtx.lineWidth = (s.size || 15);
                            } else {
                                dCtx.globalCompositeOperation = 'source-over';
                                dCtx.strokeStyle = s.color || '#ef4444';
                                dCtx.lineWidth = (s.size || 3);
                            }
                            dCtx.beginPath();
                            dCtx.moveTo(s.points[0].x, s.points[0].y);
                            for (let i = 1; i < s.points.length; i++) {
                                dCtx.lineTo(s.points[i].x, s.points[i].y);
                            }
                            dCtx.stroke();
                            dCtx.restore();
                        });

                        const pngDataUrl = drawExportCanvas.toDataURL('image/png');
                        const pngBytes = await fetch(pngDataUrl).then(r => r.arrayBuffer());
                        const embeddedPng = await pdfLibDoc.embedPng(pngBytes);
                        page.drawImage(embeddedPng, {
                            x: 0,
                            y: 0,
                            width: pageWidth,
                            height: pageHeight
                        });
                    }

                    // 5) IMAGES AND SIGNATURES
                    for (const a of annotations) {
                        if (a.type === 'image' && a.dataUrl) {
                            try {
                                const c = mapCoord(a);
                                const imgBytes = await fetch(a.dataUrl).then(r => r.arrayBuffer());
                                const isJpeg = a.dataUrl.startsWith('data:image/jpeg') || a.dataUrl.startsWith('data:image/jpg');
                                const embedded = isJpeg ? await pdfLibDoc.embedJpg(imgBytes) : await pdfLibDoc.embedPng(imgBytes);

                                page.drawImage(embedded, {
                                    x: c.x,
                                    y: c.y,
                                    width: c.width,
                                    height: c.height
                                });
                            } catch (e) {
                                console.warn('Failed to embed image annotation:', e);
                            }
                        }
                    }

                    // 6) TEXT ANNOTATIONS
                    for (const a of annotations) {
                        if (a.type === 'text' && a.text) {
                            const c = mapCoord(a);
                            const col = hexToRgb(a.color);
                            const fs = a.fontSize || 16;

                            // Select font
                            let fontKey = 'Helvetica';
                            if (a.fontFamily === 'Times') {
                                fontKey = a.bold && a.italic ? 'TimesBoldItalic' : (a.bold ? 'TimesBold' : (a.italic ? 'TimesItalic' : 'Times'));
                            } else if (a.fontFamily === 'Courier') {
                                fontKey = a.bold && a.italic ? 'CourierBoldOblique' : (a.bold ? 'CourierBold' : (a.italic ? 'CourierOblique' : 'Courier'));
                            } else {
                                fontKey = a.bold && a.italic ? 'HelveticaBoldOblique' : (a.bold ? 'HelveticaBold' : (a.italic ? 'HelveticaOblique' : 'Helvetica'));
                            }
                            const font = fonts[fontKey] || fonts.Helvetica;

                            const lines = a.text.split('\n');
                            const lineHeight = fs * 1.25;

                            lines.forEach((rawLine, idx) => {
                                const sanitized = sanitizeWinAnsi(rawLine);
                                if (!sanitized) return;

                                let lineX = c.x;
                                if (a.align === 'center' || a.align === 'right') {
                                    const textW = font.widthOfTextAtSize(sanitized, fs);
                                    if (a.align === 'center') {
                                        lineX = c.x + (c.width - textW) / 2;
                                    } else if (a.align === 'right') {
                                        lineX = c.x + (c.width - textW);
                                    }
                                }

                                const baselineY = c.y + c.height - (fs * 0.85) - (idx * lineHeight);

                                page.drawText(sanitized, {
                                    x: lineX,
                                    y: baselineY,
                                    size: fs,
                                    font: font,
                                    color: rgb(col.r, col.g, col.b)
                                });
                            });
                        }
                    }
                }

                // Save PDF and trigger download
                const modifiedBytes = await pdfLibDoc.save();
                const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `Edited_${originalFileName}`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                }, 500);

            } catch (err) {
                console.error(err);
                alert('Export failed: ' + (err.message || 'Unknown error occurred while generating PDF.'));
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = '<i data-lucide="download" style="width:16px;height:16px"></i> Export PDF';
                lucide.createIcons();
            }
        });
    </script>
    <script src="../src/js/tools-menu.js"></script>
    <script src="../src/js/protect.js"></script>
    <script src="../src/js/adblock-detect.js" defer></script>
</body>
