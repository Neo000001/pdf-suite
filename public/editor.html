<html lang="en" data-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PDF - PDFSuite</title>
    <meta name="description"
        content="Free, full-featured online PDF editor. Add text, erase/whiteout, draw, highlight, add shapes, insert images, and sign PDFs securely in your browser.">

    <link rel="stylesheet" href="../src/css/base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048088905906211"
        crossorigin="anonymous"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* === TOP HEADER === */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            height: 52px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            gap: 1rem;
            z-index: 30;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .editor-logo {
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .editor-logo span {
            color: var(--accent);
        }

        .doc-title {
            font-size: 0.85rem;
            color: var(--fg-muted);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(148, 163, 184, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--fg);
        }

        .page-nav button {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .page-nav button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .page-nav button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .btn-header-action {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-header-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-export {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .btn-export:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-export:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* === MAIN TOOLBAR === */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 0.75rem;
            height: 48px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            z-index: 20;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border-subtle);
            margin: 0 6px;
            flex-shrink: 0;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--fg-muted);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tool-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .tool-btn:hover {
            background: rgba(96, 165, 250, 0.08);
            color: var(--fg);
            border-color: var(--border-subtle);
        }

        .tool-btn.active {
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-color: rgba(37, 99, 235, 0.4);
            font-weight: 600;
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .color-pick {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            cursor: pointer;
            padding: 0;
            background: transparent;
        }

        .font-size-input,
        .stroke-size-input,
        .tool-select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: var(--bg);
            color: var(--fg);
            font-size: 0.82rem;
            text-align: center;
            outline: none;
        }

        .font-size-input {
            width: 46px;
        }

        .tool-select {
            padding: 4px 8px;
            text-align: left;
        }

        .format-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: var(--bg);
            color: var(--fg);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        .format-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        label.toolbar-label {
            font-size: 0.78rem;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        /* === EDITOR BODY === */
        .editor-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* === CANVAS AREA === */
        .canvas-area {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            background: #090d1e;
            position: relative;
        }

        html[data-theme="light"] .canvas-area {
            background: #e2e8f0;
        }

        .pdf-wrap {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            background: #fff;
            display: inline-block;
            transform-origin: top center;
        }

        #pdfCanvas {
            display: block;
            pointer-events: none;
        }

        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #interactionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 15;
        }

        #interactionCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* Annotation layer */
        #annotationLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #annotationLayer.mode-select {
            pointer-events: auto;
        }

        #annotationLayer.mode-text {
            pointer-events: auto;
            cursor: text;
        }

        #annotationLayer.mode-draw,
        #annotationLayer.mode-whiteout,
        #annotationLayer.mode-redact,
        #annotationLayer.mode-highlight,
        #annotationLayer.mode-shape {
            pointer-events: none;
        }

        /* === ANNOTATION ITEMS === */
        .anno-item {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            box-sizing: border-box;
            user-select: none;
        }

        .anno-item.selected {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }

        /* Selection handles */
        .anno-handle {
            position: absolute;
            width: 9px;
            height: 9px;
            background: #2563eb;
            border: 1.5px solid #fff;
            border-radius: 50%;
            display: none;
            z-index: 25;
        }

        .anno-item.selected .anno-handle {
            display: block;
        }

        .anno-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .anno-handle.n  { top: -5px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .anno-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .anno-handle.e  { top: 50%; right: -5px; transform: translateY(-50%); cursor: e-resize; }
        .anno-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }
        .anno-handle.s  { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .anno-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .anno-handle.w  { top: 50%; left: -5px; transform: translateY(-50%); cursor: w-resize; }

        /* Item action toolbar (Delete / Duplicate) */
        .anno-actions-bar {
            position: absolute;
            top: -30px;
            right: 0;
            display: none;
            gap: 4px;
            background: #1e293b;
            padding: 2px 4px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 30;
        }

        .anno-item.selected .anno-actions-bar {
            display: flex;
        }

        .anno-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
        }

        .anno-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .anno-btn.btn-del:hover {
            background: #ef4444;
        }

        /* Specific item styles */
        .anno-text-box {
            background: transparent;
            min-width: 40px;
            min-height: 20px;
            border: 1px dashed rgba(37, 99, 235, 0.5);
            padding: 2px 4px;
        }

        .anno-text-box.selected {
            border: 1px solid #2563eb;
        }

        .anno-text-inner {
            width: 100%;
            height: 100%;
            outline: none;
            cursor: text;
            user-select: text;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.25;
        }

        .anno-whiteout {
            background: #ffffff;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        }

        .anno-redact {
            background: #000000;
        }

        .anno-highlight {
            cursor: move;
        }

        .anno-shape-rect {
            box-sizing: border-box;
        }

        .anno-shape-circle {
            box-sizing: border-box;
            border-radius: 50%;
        }

        .anno-image img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* === UPLOAD STATE === */
        #uploadState {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            border: 2px dashed var(--border-subtle);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 520px;
            width: 100%;
            background: var(--bg-soft);
        }

        #uploadState:hover {
            border-color: var(--accent);
            background: rgba(96, 165, 250, 0.04);
            transform: translateY(-2px);
        }

        #uploadState svg {
            width: 54px;
            height: 54px;
            color: var(--accent);
        }

        #uploadState h2 {
            font-size: 1.3rem;
            margin: 0;
        }

        #uploadState p {
            color: var(--fg-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .canvas-area.editing #uploadState {
            display: none;
        }

        .pdf-wrap {
            display: none;
        }

        .canvas-area.editing .pdf-wrap {
            display: inline-block;
        }

        /* === SIDEBAR PAGE THUMBNAILS === */
        .thumb-sidebar {
            width: 140px;
            background: var(--bg-soft);
            border-right: 1px solid var(--border-subtle);
            overflow-y: auto;
            padding: 0.75rem 0.5rem;
            flex-shrink: 0;
            display: none;
            flex-direction: column;
            gap: 0.6rem;
            z-index: 15;
        }

        .canvas-area.editing ~ .thumb-sidebar,
        .editor-body.has-doc .thumb-sidebar {
            display: flex;
        }

        .thumb-item {
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            padding: 5px;
            transition: all 0.15s;
            background: var(--bg);
        }

        .thumb-item.active {
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.35);
        }

        .thumb-item:hover:not(.active) {
            border-color: var(--border-subtle);
        }

        .thumb-item canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #fff;
            border-radius: 4px;
        }

        .thumb-item p {
            font-size: 0.75rem;
            color: var(--fg-muted);
            margin-top: 4px;
            font-weight: 600;
        }

        /* === MODAL STYLES === */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            width: 520px;
            max-width: 95vw;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            color: var(--fg);
        }

        .modal h3 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .sig-canvas {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: #fff;
            width: 100%;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            justify-content: flex-end;
            align-items: center;
        }

        .btn-modal-sec {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.15s;
        }

        .btn-modal-sec:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-modal-pri {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: background 0.15s;
        }

        .btn-modal-pri:hover {
            background: #1d4ed8;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .thumb-sidebar {
                display: none !important;
            }

            .canvas-area {
                padding: 0.75rem;
            }

            .editor-toolbar {
                height: auto;
                min-height: 48px;
                flex-wrap: wrap;
                padding: 6px;
                gap: 4px;
            }

            .tool-btn {
                padding: 5px 8px;
                font-size: 0.78rem;
            }
        }
    </style>

    <!-- Auto Theme Detector -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('pdfsuite-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const hour = new Date().getHours();
                const theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>
</head>

<body>

    <!-- TOP HEADER -->
    <header class="editor-header">
        <div class="header-left">
            <a href="../index.html" class="editor-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                PDF<span>Suite</span>
            </a>
            <span class="doc-title" id="docTitle" style="display:none">Document.pdf</span>
        </div>

        <div class="page-nav" id="pageNav" style="display:none">
            <button id="prevPage" title="Previous Page"><i data-lucide="chevron-left" style="width:14px;height:14px"></i></button>
            <span id="pageInfo">1 / 1</span>
            <button id="nextPage" title="Next Page"><i data-lucide="chevron-right" style="width:14px;height:14px"></i></button>
        </div>

        <div class="header-actions">
            <button class="btn-header-action" id="themeToggleBtn" aria-label="Toggle Theme" title="Switch Theme">
                <i data-lucide="moon" id="themeIcon" style="width:16px;height:16px"></i>
            </button>
            <button class="btn-export" id="exportBtn" disabled title="Download edited PDF (Ctrl+S)">
                <i data-lucide="download" style="width:16px;height:16px"></i>
                Export PDF
            </button>
        </div>
    </header>

    <!-- MAIN TOOLBAR -->
    <div class="editor-toolbar" id="editorToolbar" style="display:none">

        <!-- PRIMARY TOOLS -->
        <div class="toolbar-group">
            <button class="tool-btn active" data-tool="select" title="Select, Move & Resize (Esc)">
                <i data-lucide="mouse-pointer"></i> Select
            </button>
            <button class="tool-btn" data-tool="text" title="Add or Edit Text">
                <i data-lucide="type"></i> Text
            </button>
            <button class="tool-btn" data-tool="whiteout" title="Whiteout / Erase existing content">
                <i data-lucide="eraser"></i> Whiteout
            </button>
            <button class="tool-btn" data-tool="redact" title="Redact / Blackout sensitive text">
                <i data-lucide="eye-off"></i> Redact
            </button>
            <button class="tool-btn" data-tool="highlight" title="Highlight box">
                <i data-lucide="highlighter"></i> Highlight
            </button>
            <button class="tool-btn" data-tool="draw" title="Freehand Pen">
                <i data-lucide="pencil"></i> Draw
            </button>
            <button class="tool-btn" data-tool="eraser" title="Erase freehand pen strokes">
                <i data-lucide="paint-brush"></i> Pen Eraser
            </button>
            <button class="tool-btn" data-tool="shape" title="Shapes (Rectangle, Circle, Line)">
                <i data-lucide="square"></i> Shape
            </button>
            <button class="tool-btn" data-tool="sign" title="Add Signature">
                <i data-lucide="pen-tool"></i> Sign
            </button>
            <button class="tool-btn" id="insertImageBtn" title="Insert image or stamp">
                <i data-lucide="image"></i> Image
            </button>
        </div>

        <div class="toolbar-sep"></div>

        <!-- CONTEXTUAL CONTROLS -->
        <div class="toolbar-group" id="optTextGroup">
            <label class="toolbar-label">Size:</label>
            <input type="number" class="font-size-input" id="fontSize" value="16" min="8" max="96">

            <label class="toolbar-label">Font:</label>
            <select class="tool-select" id="fontFamily">
                <option value="Helvetica">Helvetica (Sans)</option>
                <option value="Times">Times (Serif)</option>
                <option value="Courier">Courier (Mono)</option>
            </select>

            <button class="format-btn" id="btnBold" title="Bold">B</button>
            <button class="format-btn" id="btnItalic" title="Italic" style="font-style:italic">I</button>

            <label class="toolbar-label">Color:</label>
            <input type="color" class="color-pick" id="textColor" value="#000000" title="Text Color">
        </div>

        <div class="toolbar-group" id="optDrawGroup" style="display:none;">
            <label class="toolbar-label">Pen Color:</label>
            <input type="color" class="color-pick" id="drawColor" value="#ef4444" title="Stroke Color">
            <label class="toolbar-label">Thickness:</label>
            <input type="range" id="drawSize" min="1" max="24" value="3" style="width:70px" title="Pen Size">
            <span id="drawSizeVal" style="font-size:0.75rem; color:var(--fg-muted);">3px</span>
        </div>

        <div class="toolbar-group" id="optHighlightGroup" style="display:none;">
            <label class="toolbar-label">Highlight Color:</label>
            <input type="color" class="color-pick" id="hlColor" value="#facc15" title="Highlight Color">
        </div>

        <div class="toolbar-group" id="optShapeGroup" style="display:none;">
            <label class="toolbar-label">Shape:</label>
            <select class="tool-select" id="shapeType">
                <option value="rect">Rectangle</option>
                <option value="circle">Circle</option>
                <option value="line">Line</option>
                <option value="arrow">Arrow</option>
            </select>
            <label class="toolbar-label">Border:</label>
            <input type="color" class="color-pick" id="shapeStrokeColor" value="#2563eb" title="Border Color">
            <label class="toolbar-label">Fill:</label>
            <input type="color" class="color-pick" id="shapeFillColor" value="#ffffff" title="Fill Color">

        <div class="toolbar-sep"></div>

        <!-- ACTIONS -->
        <div class="toolbar-group">
            <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)"><i data-lucide="undo-2"></i></button>
            <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)"><i data-lucide="redo-2"></i></button>

        <div class="toolbar-sep"></div>

        <!-- ZOOM CONTROLS -->

            <button class="tool-btn" id="zoomOut" title="Zoom Out (-)"><i data-lucide="zoom-out"></i></button>
            <label class="toolbar-label" id="zoomLabel" style="min-width:44px; text-align:center;">100%</label>
            <button class="tool-btn" id="zoomIn" title="Zoom In (+)"><i data-lucide="zoom-in"></i></button>
            <button class="tool-btn" id="fitWidthBtn" title="Fit to Width"><i data-lucide="maximize-2"></i></button>
        </div>

    </div>

    <!-- HIDDEN IMAGE INPUT -->
    <input type="file" id="directImageInput" accept="image/*" hidden>

    <!-- EDITOR BODY -->
    <div class="editor-body" id="editorBody">

        <!-- PAGE THUMBNAILS SIDEBAR -->
        <div class="thumb-sidebar" id="thumbSidebar"></div>

        <!-- CANVAS AREA -->
        <div class="canvas-area" id="canvasArea">
            <div id="uploadState">
                <input type="file" id="fileInput" accept="application/pdf" hidden>
                <i data-lucide="file-up"></i>
                <h2>Open a PDF to Edit</h2>

            <div class="pdf-wrap" id="pdfWrap">

    <!-- SIGNATURE MODAL -->
    <div class="modal-backdrop" id="sigModal">
        <div class="modal">
            <h3>Add Signature</h3>

            <!-- Tabs -->
            <div style="display:flex; border:1px solid var(--border-subtle); border-radius:10px; overflow:hidden; margin-bottom:1.25rem;">

            </div>

                    onclick="document.getElementById('sigFileInput').click()">

                    <p style="margin:0; font-size:0.82rem; color:var(--fg-muted);">PNG, JPG, WebP supported</p>
                    <input type="file" id="sigFileInput" accept="image/*" hidden>

                <div id="sigUploadControls" style="display:none;">
                    <canvas id="sigUploadPreview" width="460" height="150"
                        style="width:100%; border:1px solid var(--border-subtle); border-radius:8px; display:block; background-color: #e5e5f7; background-image: repeating-linear-gradient(45deg, #c5c5db 25%, transparent 25%, transparent 75%, #c5c5db 75%, #c5c5db), repeating-linear-gradient(45deg, #c5c5db 25%, #e5e5f7 25%, #e5e5f7 75%, #c5c5db 75%, #c5c5db); background-position: 0 0, 10px 10px; background-size: 20px 20px;"></canvas>

                    <label style="display:flex; font-size:0.85rem; color:var(--fg); margin-top:0.75rem; align-items:center; gap:0.5rem; cursor:pointer; font-weight:600;">

                    </label>

                    <div id="sigRemoveBgOptions" style="margin-top:0.5rem; padding-left:1.5rem; border-left:2px solid var(--border-subtle);">
                        <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem;">
                            <span style="font-size:0.75rem; color:var(--fg-muted);">Sensitivity:</span>
                            <input type="range" id="sigBgTolerance" min="100" max="250" value="180" style="flex:1;">
                        </div>
                        <label style="display:flex; font-size:0.8rem; color:var(--fg); align-items:center; gap:0.4rem; cursor:pointer;">
                            <input type="checkbox" id="sigMakeBlack" checked> Darken strokes to solid black
                        </label>
