<html lang="en" data-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit PDF - PDFSuite</title>
    <meta name="description"
        content="Free, full-featured online PDF editor. Add text, erase/whiteout, draw, highlight, add shapes, insert images, and sign PDFs securely in your browser.">

    <link rel="stylesheet" href="../src/css/base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7048088905906211"
        crossorigin="anonymous"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* === TOP HEADER === */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            height: 52px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            gap: 1rem;
            z-index: 30;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .editor-logo {
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .editor-logo span {
            color: var(--accent);
        }

        .doc-title {
            font-size: 0.85rem;
            color: var(--fg-muted);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            background: rgba(148, 163, 184, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--fg);
        }

        .page-nav button {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .page-nav button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .page-nav button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .btn-header-action {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .btn-header-action:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-export {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .btn-export:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-export:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* === MAIN TOOLBAR === */
        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 0.75rem;
            height: 48px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: thin;
            z-index: 20;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .toolbar-sep {
            width: 1px;
            height: 24px;
            background: var(--border-subtle);
            margin: 0 6px;
            flex-shrink: 0;
        }

        .tool-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--fg-muted);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tool-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .tool-btn:hover {
            background: rgba(96, 165, 250, 0.08);
            color: var(--fg);
            border-color: var(--border-subtle);
        }

        .tool-btn.active {
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-color: rgba(37, 99, 235, 0.4);
            font-weight: 600;
        }

        .tool-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .color-pick {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            cursor: pointer;
            padding: 0;
            background: transparent;
        }

        .font-size-input,
        .stroke-size-input,
        .tool-select {
            padding: 4px 6px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: var(--bg);
            color: var(--fg);
            font-size: 0.82rem;
            text-align: center;
            outline: none;
        }

        .font-size-input {
            width: 46px;
        }

        .tool-select {
            padding: 4px 8px;
            text-align: left;
        }

        .format-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: var(--bg);
            color: var(--fg);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
        }

        .format-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        label.toolbar-label {
            font-size: 0.78rem;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        /* === EDITOR BODY === */
        .editor-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* === CANVAS AREA === */
        .canvas-area {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            background: #090d1e;
            position: relative;
        }

        html[data-theme="light"] .canvas-area {
            background: #e2e8f0;
        }

        .pdf-wrap {
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
            background: #fff;
            display: inline-block;
            transform-origin: top center;
        }

        #pdfCanvas {
            display: block;
            pointer-events: none;
        }

        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #interactionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 15;
        }

        #interactionCanvas.active {
            pointer-events: auto;
            cursor: crosshair;
        }

        /* Text layer (PDF.js text for selection, hover, and in-place editing) */
        .textLayer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 1;
            line-height: 1.0;
            z-index: 4;
            pointer-events: auto;
        }

        .textLayer span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
            transition: background 0.12s, outline 0.12s;
            border-radius: 2px;
        }

        .textLayer ::selection {
            background: rgba(37, 99, 235, 0.35);
            color: transparent;
        }

        /* Hover effect when Edit Text or Select tool is active */
        .mode-select .textLayer span:hover,
        .mode-text .textLayer span:hover {
            background: rgba(37, 99, 235, 0.15) !important;
            outline: 1.5px dashed #2563eb;
            cursor: pointer;
        }

        /* Annotation layer (custom annotations sit on top of text layer) */
        #annotationLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* === ANNOTATION ITEMS === */
        .anno-item {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            box-sizing: border-box;
            user-select: none;
        }

        .anno-item.selected {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }

        /* Selection handles */
        .anno-handle {
            position: absolute;
            width: 9px;
            height: 9px;
            background: #2563eb;
            border: 1.5px solid #fff;
            border-radius: 50%;
            display: none;
            z-index: 25;
        }

        .anno-item.selected .anno-handle {
            display: block;
        }

        .anno-handle.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .anno-handle.n  { top: -5px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
        .anno-handle.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .anno-handle.e  { top: 50%; right: -5px; transform: translateY(-50%); cursor: e-resize; }
        .anno-handle.se { bottom: -5px; right: -5px; cursor: se-resize; }
        .anno-handle.s  { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
        .anno-handle.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .anno-handle.w  { top: 50%; left: -5px; transform: translateY(-50%); cursor: w-resize; }

        /* Item action toolbar (Delete / Duplicate) */
        .anno-actions-bar {
            position: absolute;
            top: -30px;
            right: 0;
            display: none;
            gap: 4px;
            background: #1e293b;
            padding: 2px 4px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 30;
        }

        .anno-item.selected .anno-actions-bar {
            display: flex;
        }

        .anno-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
        }

        .anno-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .anno-btn.btn-del:hover {
            background: #ef4444;
        }

        /* Specific item styles */
        .anno-text-box {
            background: transparent;
            min-width: 40px;
            min-height: 20px;
            border: 1px dashed rgba(37, 99, 235, 0.5);
            padding: 2px 4px;
        }

        .anno-text-box.selected {
            border: 1px solid #2563eb;
        }

        .anno-text-inner {
            width: 100%;
            height: 100%;
            outline: none;
            cursor: text;
            user-select: text;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.25;
        }

        .anno-whiteout {
            background: #ffffff;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.1);
        }

        .anno-redact {
            background: #000000;
        }

        .anno-highlight {
            cursor: move;
        }

        .anno-shape-rect {
            box-sizing: border-box;
        }

        .anno-shape-circle {
            box-sizing: border-box;
            border-radius: 50%;
        }

        .anno-image img {
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* === UPLOAD STATE === */
        #uploadState {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 4rem 2rem;
            border: 2px dashed var(--border-subtle);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 520px;
            width: 100%;
            background: var(--bg-soft);
        }

        #uploadState:hover {
            border-color: var(--accent);
            background: rgba(96, 165, 250, 0.04);
            transform: translateY(-2px);
        }

        #uploadState svg {
            width: 54px;
            height: 54px;
            color: var(--accent);
        }

        #uploadState h2 {
            font-size: 1.3rem;
            margin: 0;
        }

        #uploadState p {
            color: var(--fg-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        .canvas-area.editing #uploadState {
            display: none;
        }

        .pdf-wrap {
            display: none;
        }

        .canvas-area.editing .pdf-wrap {
            display: inline-block;
        }

        /* === SIDEBAR PAGE THUMBNAILS === */
        .thumb-sidebar {
            width: 140px;
            background: var(--bg-soft);
            border-right: 1px solid var(--border-subtle);
            overflow-y: auto;
            padding: 0.75rem 0.5rem;
            flex-shrink: 0;
            display: none;
            flex-direction: column;
            gap: 0.6rem;
            z-index: 15;
        }

        .canvas-area.editing ~ .thumb-sidebar,
        .editor-body.has-doc .thumb-sidebar {
            display: flex;
        }

        .editor-body.sidebar-collapsed .thumb-sidebar {
            display: none !important;
        }

        .thumb-item {
            position: relative;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            padding: 5px;
            transition: all 0.15s;
            background: var(--bg);
            overflow: hidden;
            user-select: none;
        }

        .thumb-item[draggable="true"] {
            cursor: grab;
        }

        .thumb-item.dragging {
            opacity: 0.4;
            cursor: grabbing;
            border-color: #3b82f6;
            transform: scale(0.97);
        }

        .thumb-item.drag-over {
            border-top: 3px solid #2563eb;
            background: rgba(37, 99, 235, 0.08);
        }

        .thumb-item.active {
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.35);
        }

        .thumb-item:hover:not(.active) {
            border-color: var(--border-subtle);
        }

        .thumb-item canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #fff;
            border-radius: 4px;
        }

        .thumb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding: 0 2px;
        }

        .thumb-page-num {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--fg-muted);
        }

        .thumb-actions {
            display: none;
            align-items: center;
            gap: 3px;
        }

        .thumb-item:hover .thumb-actions {
            display: flex;
        }

        .thumb-act-btn {
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 4px;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            padding: 0;
        }

        .thumb-act-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .thumb-del-btn:hover {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
        }

        .add-blank-page-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 8px 6px;
            background: transparent;
            border: 1.5px dashed var(--border-subtle);
            border-radius: 8px;
            color: var(--fg-muted);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .add-blank-page-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(37, 99, 235, 0.05);
        }

        /* === FLOATING TEXT SELECTION QUICK ACTION BAR === */
        .floating-selection-bar {
            position: fixed;
            z-index: 999;
            display: none;
            align-items: center;
            gap: 4px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 6px;
            border-radius: 10px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            transform: translateX(-50%) translateY(-100%);
            margin-top: -8px;
            animation: fadeInQuick 0.15s ease-out;
        }

        [data-theme="light"] .floating-selection-bar {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.15);
        }

        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            border: none;
            color: var(--fg);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            font-family: inherit;
        }

        .quick-btn svg {
            width: 14px;
            height: 14px;
        }

        .quick-btn:hover {
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
        }

        [data-theme="light"] .quick-btn:hover {
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
        }

        /* === FLOATING FORMATTING INSPECTOR === */
        .floating-format-bar {
            position: absolute;
            z-index: 50;
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            padding: 5px 8px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            white-space: nowrap;
            animation: fadeInQuick 0.15s ease-out;
        }

        [data-theme="light"] .floating-format-bar {
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        .fmt-section {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fmt-select {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 0.78rem;
            cursor: pointer;
            outline: none;
        }

        .fmt-btn {
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            color: var(--fg);
            border-radius: 6px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .fmt-btn svg {
            width: 14px;
            height: 14px;
        }

        .fmt-btn:hover,
        .fmt-btn.active {
            background: rgba(37, 99, 235, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .fmt-val {
            font-size: 0.8rem;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }

        .fmt-color {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid var(--border-subtle);
            cursor: pointer;
            padding: 0;
            background: transparent;
        }

        .fmt-btn-danger:hover {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        .fmt-sep {
            width: 1px;
            height: 18px;
            background: var(--border-subtle);
            margin: 0 2px;
        }

        /* === FIND & REPLACE DIALOG === */
        .find-replace-dialog {
            position: fixed;
            top: 60px;
            right: 20px;
            width: 320px;
            background: var(--bg-soft);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
            z-index: 100;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
            animation: fadeInQuick 0.15s ease-out;
        }

        [data-theme="light"] .find-replace-dialog {
            background: #ffffff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.15);
        }

        .fr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--fg);
        }

        .fr-close {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: var(--fg-muted);
            cursor: pointer;
            line-height: 1;
        }

        .fr-input-row {
            position: relative;
            display: flex;
            align-items: center;
        }

        .fr-input-row input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 54px 6px 10px;
            color: var(--fg);

    <!-- Auto Theme Detector -->
    <script>
        (function () {

            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const hour = new Date().getHours();
                const theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        lucide.createIcons();

        // ========== THEME TOGGLE ==========
        const themeBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlDoc = document.documentElement;

        function updateThemeIcon() {
            const isDark = htmlDoc.getAttribute('data-theme') === 'dark';
            if (isDark) {
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }
        updateThemeIcon();

        themeBtn.addEventListener('click', () => {
            const isDark = htmlDoc.getAttribute('data-theme') === 'dark';
            const next = isDark ? 'light' : 'dark';
            htmlDoc.setAttribute('data-theme', next);
            localStorage.setItem('pdfsuite-theme', next);
            updateThemeIcon();
        });

        // ========== STATE ==========
        let pdfDoc = null;
        let originalPdfBytes = null;
        let originalFileName = 'Document.pdf';
        let currentPage = 1;
        let scale = 1.0;
        let currentTool = 'select';
        let selectedAnnoId = null;

        // Structured storage per page (coordinates always stored in UNZOOMED PDF points):
        // pageAnnotations[pageNum] = [ { id, type, x, y, width, height, ... } ]
        const pageAnnotations = {};
        // pageDrawings[pageNum] = [ { tool: 'pen'|'eraser', color, size, points: [{x, y}] } ]
        const pageDrawings = {};
        // Page viewports at scale 1.0
        const pageDimensions = {};

        // Document-level page operations
        const pageRotations = {};       // pageNum -> extra degrees (0, 90, 180, 270)
        const deletedPages = new Set(); // set of deleted page numbers
        const addedBlankPages = [];     // [{ pageNum, width, height }]

        // History for undo/redo
        const undoHistory = [];
        const redoHistory = [];

        function recordAction(action) {
            undoHistory.push(action);
            redoHistory.length = 0; // Clear redo
            updateUndoRedoBtns();
        }

        function updateUndoRedoBtns() {
            document.getElementById('undoBtn').disabled = undoHistory.length === 0;
            document.getElementById('redoBtn').disabled = redoHistory.length === 0;
        }
        updateUndoRedoBtns();

        // ========== DOM REFS ==========
        const fileInput = document.getElementById('fileInput');
        const uploadState = document.getElementById('uploadState');
        const canvasArea = document.getElementById('canvasArea');
        const editorBody = document.getElementById('editorBody');
        const pdfWrap = document.getElementById('pdfWrap');
        const pdfCanvas = document.getElementById('pdfCanvas');
        const textLayer = document.getElementById('textLayer');
        const drawCanvas = document.getElementById('drawCanvas');
        const interactionCanvas = document.getElementById('interactionCanvas');
        const annotLayer = document.getElementById('annotationLayer');
        const exportBtn = document.getElementById('exportBtn');
        const pageNav = document.getElementById('pageNav');
        const editorToolbar = document.getElementById('editorToolbar');
        const pageInfo = document.getElementById('pageInfo');
        const docTitle = document.getElementById('docTitle');
        const thumbSidebar = document.getElementById('thumbSidebar');

        const selectionQuickBar = document.getElementById('selectionQuickBar');
        const floatingFormatBar = document.getElementById('floatingFormatBar');
        const findReplaceDialog = document.getElementById('findReplaceDialog');
        const findBtn = document.getElementById('findBtn');

        const pdfCtx = pdfCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');
        const interCtx = interactionCanvas.getContext('2d');

        // ========== LOAD PDF ==========
        uploadState.addEventListener('click', () => fileInput.click());
        uploadState.addEventListener('dragover', e => { e.preventDefault(); uploadState.style.borderColor = 'var(--accent)'; });
        uploadState.addEventListener('dragleave', () => { uploadState.style.borderColor = 'var(--border-subtle)'; });
        uploadState.addEventListener('drop', e => {
            e.preventDefault();
            uploadState.style.borderColor = 'var(--border-subtle)';
            const file = e.dataTransfer.files[0];
            if (file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
                loadPdf(file);
            }
        });

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) loadPdf(file);
        });

        async function loadPdf(file) {
            originalFileName = file.name;
            originalPdfBytes = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(originalPdfBytes) }).promise;

            docTitle.textContent = originalFileName;
            docTitle.style.display = 'block';

            canvasArea.classList.add('editing');
            editorBody.classList.add('has-doc');
            pageNav.style.display = 'flex';
            editorToolbar.style.display = 'flex';
            exportBtn.disabled = false;

            // Compute ideal initial scale
            const firstPage = await pdfDoc.getPage(1);
            const firstVp = firstPage.getViewport({ scale: 1.0 });
            pageDimensions[1] = { width: firstVp.width, height: firstVp.height };
            const availW = canvasArea.clientWidth - 80;
            if (availW > 0 && firstVp.width > 0) {
                scale = Math.min(1.5, Math.max(0.6, parseFloat((availW / firstVp.width).toFixed(2))));
            } else {
                scale = 1.0;
            }
            updateZoomLabel();

            await pageTo(1);
            buildThumbnails();
            lucide.createIcons();
        }

        // ========== RENDER PAGE ==========
        let currentRenderTask = null;

        async function renderPage(num) {
            if (!pdfDoc) return;
            const isBlank = num > pdfDoc.numPages;
            const extraRot = pageRotations[num] || 0;

            let vp;
            let page = null;
            if (!isBlank) {
                page = await pdfDoc.getPage(num);
                const currentRotation = (page.rotate + extraRot) % 360;
                vp = page.getViewport({ scale, rotation: currentRotation });
                pageDimensions[num] = { width: vp.width / scale, height: vp.height / scale };
            } else {
                const blankData = addedBlankPages.find(b => b.pageNum === num) || { width: 595, height: 842 };
                vp = { width: blankData.width * scale, height: blankData.height * scale };
                pageDimensions[num] = { width: blankData.width, height: blankData.height };
            }

            // High-DPI crisp rendering
            const dpr = window.devicePixelRatio || 1;
            pdfCanvas.width = Math.floor(vp.width * dpr);
            pdfCanvas.height = Math.floor(vp.height * dpr);
            pdfCanvas.style.width = Math.floor(vp.width) + 'px';
            pdfCanvas.style.height = Math.floor(vp.height) + 'px';

            textLayer.style.width = Math.floor(vp.width) + 'px';
            textLayer.style.height = Math.floor(vp.height) + 'px';

            drawCanvas.width = Math.floor(vp.width * dpr);
            drawCanvas.height = Math.floor(vp.height * dpr);
            drawCanvas.style.width = Math.floor(vp.width) + 'px';
            drawCanvas.style.height = Math.floor(vp.height) + 'px';

            interactionCanvas.width = Math.floor(vp.width * dpr);
            interactionCanvas.height = Math.floor(vp.height * dpr);
            interactionCanvas.style.width = Math.floor(vp.width) + 'px';
            interactionCanvas.style.height = Math.floor(vp.height) + 'px';

            annotLayer.style.width = Math.floor(vp.width) + 'px';
            annotLayer.style.height = Math.floor(vp.height) + 'px';

            pdfCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            interCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (currentRenderTask) currentRenderTask.cancel();

            if (!isBlank && page) {
                currentRenderTask = page.render({ canvasContext: pdfCtx, viewport: vp });
                await currentRenderTask.promise.catch(() => { });
                await renderTextLayerForPage(page, vp);
            } else {
                pdfCtx.fillStyle = '#ffffff';
                pdfCtx.fillRect(0, 0, vp.width, vp.height);
                textLayer.innerHTML = '';
            }

            const totalPages = pdfDoc.numPages + addedBlankPages.length;
            pageInfo.innerText = `${num} / ${totalPages}`;
            document.getElementById('prevPage').disabled = num <= 1;
            document.getElementById('nextPage').disabled = num >= totalPages;

            renderDrawings(num);
            renderAnnotations(num);
            highlightThumb(num);
        }

        // Render PDF.js Text Layer so existing text in the PDF is interactive, selectable, and editable
        async function renderTextLayerForPage(page, vp) {
            textLayer.innerHTML = '';
            try {
                const textContent = await page.getTextContent();
                if (pdfjsLib.renderTextLayer) {
                    const task = pdfjsLib.renderTextLayer({
                        textContent: textContent,
                        container: textLayer,
                        viewport: vp,
                        textDivs: []
                    });
                    if (task && task.promise) {
                        await task.promise.catch(() => { });
                    }
                }
            } catch (err) {
                console.warn('Text layer render:', err);
            }
        }

        async function pageTo(n) {
            currentPage = n;
            selectedAnnoId = null;
            hideSelectionQuickBar();
            hideFloatingFormatBar();
            await renderPage(n);
        }

        document.getElementById('prevPage').addEventListener('click', () => {
            let prev = currentPage - 1;
            while (prev >= 1 && deletedPages.has(prev)) prev--;
            if (prev >= 1) pageTo(prev);
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            const total = pdfDoc ? pdfDoc.numPages + addedBlankPages.length : 1;
            let next = currentPage + 1;
            while (next <= total && deletedPages.has(next)) next++;
            if (next <= total) pageTo(next);
        });

        // ========== TOOL SWITCHING ==========
        const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
        toolBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                const tool = this.dataset.tool;
                if (tool === 'sign') {
                    openSigModal();
                    return;
                }
                setTool(tool);
            });
        });

        function setTool(tool) {
            currentTool = tool;
            toolBtns.forEach(b => b.classList.toggle('active', b.dataset.tool === tool));

            // Layer classes and interaction modes
            annotLayer.className = 'mode-' + tool;
            const isCanvasDrawing = ['draw', 'eraser', 'whiteout', 'redact', 'highlight', 'shape'].includes(tool);
            interactionCanvas.classList.toggle('active', isCanvasDrawing);

            // Contextual options visibility
            document.getElementById('optTextGroup').style.display = (tool === 'text' || tool === 'select') ? 'flex' : 'none';
            document.getElementById('optDrawGroup').style.display = (tool === 'draw') ? 'flex' : 'none';
            document.getElementById('optHighlightGroup').style.display = (tool === 'highlight') ? 'flex' : 'none';
            document.getElementById('optShapeGroup').style.display = (tool === 'shape') ? 'flex' : 'none';

            if (tool !== 'select') {
                deselectAnno();
            }
        }

        // ========== DRAW SIZE SLIDER ==========
        const drawSizeSlider = document.getElementById('drawSize');
        const drawSizeVal = document.getElementById('drawSizeVal');
        drawSizeSlider.addEventListener('input', () => {
            drawSizeVal.textContent = drawSizeSlider.value + 'px';
        });

        // ========== RENDER DRAWINGS ==========
        function renderDrawings(num) {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            const strokes = pageDrawings[num] || [];
            strokes.forEach(s => {
                if (!s.points || s.points.length === 0) return;
                drawCtx.save();
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                if (s.tool === 'eraser') {
                    drawCtx.globalCompositeOperation = 'destination-out';
                    drawCtx.lineWidth = (s.size || 15) * scale;
                } else {
                    drawCtx.globalCompositeOperation = 'source-over';
                    drawCtx.strokeStyle = s.color || '#ef4444';
                    drawCtx.lineWidth = (s.size || 3) * scale;
                }

                drawCtx.beginPath();
                drawCtx.moveTo(s.points[0].x * scale, s.points[0].y * scale);
                for (let i = 1; i < s.points.length; i++) {
                    drawCtx.lineTo(s.points[i].x * scale, s.points[i].y * scale);
                }
                drawCtx.stroke();
                drawCtx.restore();
            });
        }

        // ========== FREEHAND DRAW & INTERACTION CANVAS ==========
        let isInteracting = false;
        let activeStroke = null;
        let dragStartX = 0, dragStartY = 0;

        function getPdfCoords(e) {
            const rect = pdfCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
            const y = Math.max(0, Math.min(rect.height, clientY - rect.top));
            return {
                screenX: x,
                screenY: y,
                pdfX: x / scale,
                pdfY: y / scale
            };
        }

        interactionCanvas.addEventListener('mousedown', startCanvasInteraction);
        interactionCanvas.addEventListener('touchstart', startCanvasInteraction, { passive: false });

        window.addEventListener('mousemove', moveCanvasInteraction);
        window.addEventListener('touchmove', moveCanvasInteraction, { passive: false });

        window.addEventListener('mouseup', endCanvasInteraction);
        window.addEventListener('touchend', endCanvasInteraction);

        function startCanvasInteraction(e) {
            if (e.target !== interactionCanvas) return;
            e.preventDefault();
            isInteracting = true;
            const pt = getPdfCoords(e);
            dragStartX = pt.pdfX;
            dragStartY = pt.pdfY;

            if (currentTool === 'draw' || currentTool === 'eraser') {
                activeStroke = {
                    tool: currentTool,
                    color: document.getElementById('drawColor').value,
                    size: parseInt(document.getElementById('drawSize').value) || 3,
                    points: [{ x: pt.pdfX, y: pt.pdfY }]
                };
            }
        }

        function moveCanvasInteraction(e) {
            if (!isInteracting) return;
            e.preventDefault();
            const pt = getPdfCoords(e);

            if (currentTool === 'draw' || currentTool === 'eraser') {
                activeStroke.points.push({ x: pt.pdfX, y: pt.pdfY });
                // Draw current segment live
                drawCtx.save();
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                if (activeStroke.tool === 'eraser') {
                    drawCtx.globalCompositeOperation = 'destination-out';
                    drawCtx.lineWidth = (activeStroke.size * 3) * scale;
                } else {
                    drawCtx.globalCompositeOperation = 'source-over';
                    drawCtx.strokeStyle = activeStroke.color;
                    drawCtx.lineWidth = activeStroke.size * scale;
                }
                const pts = activeStroke.points;
                const len = pts.length;
                if (len >= 2) {
                    drawCtx.beginPath();
                    drawCtx.moveTo(pts[len - 2].x * scale, pts[len - 2].y * scale);
                    drawCtx.lineTo(pts[len - 1].x * scale, pts[len - 1].y * scale);
                    drawCtx.stroke();
                }
                drawCtx.restore();
            } else if (['whiteout', 'redact', 'highlight', 'shape'].includes(currentTool)) {
                // Live drag preview on interaction canvas
                interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);
                const x = Math.min(dragStartX, pt.pdfX) * scale;
                const y = Math.min(dragStartY, pt.pdfY) * scale;
                const w = Math.abs(pt.pdfX - dragStartX) * scale;
                const h = Math.abs(pt.pdfY - dragStartY) * scale;

                interCtx.save();
                if (currentTool === 'whiteout') {
                    interCtx.fillStyle = '#ffffff';
                    interCtx.strokeStyle = '#94a3b8';
                    interCtx.lineWidth = 1;
                    interCtx.fillRect(x, y, w, h);
                    interCtx.strokeRect(x, y, w, h);
                } else if (currentTool === 'redact') {
                    interCtx.fillStyle = '#000000';
                    interCtx.fillRect(x, y, w, h);
                } else if (currentTool === 'highlight') {
                    interCtx.fillStyle = document.getElementById('hlColor').value + '66';
                    interCtx.fillRect(x, y, w, h);
                } else if (currentTool === 'shape') {
                    const st = document.getElementById('shapeType').value;
                    const strokeCol = document.getElementById('shapeStrokeColor').value;
                    const fillCol = document.getElementById('shapeFillColor').value;
                    const noFill = document.getElementById('shapeTransparentFill').checked;
                    const strokeW = (parseInt(document.getElementById('shapeWidth').value) || 2) * scale;

                    interCtx.strokeStyle = strokeCol;
                    interCtx.lineWidth = strokeW;
                    if (!noFill) interCtx.fillStyle = fillCol;

                    if (st === 'rect') {
                        if (!noFill) interCtx.fillRect(x, y, w, h);
                        interCtx.strokeRect(x, y, w, h);
                    } else if (st === 'circle') {
                        interCtx.beginPath();
                        interCtx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
                        if (!noFill) interCtx.fill();
                        interCtx.stroke();
                    } else if (st === 'line' || st === 'arrow') {
                        interCtx.beginPath();
                        interCtx.moveTo(dragStartX * scale, dragStartY * scale);
                        interCtx.lineTo(pt.pdfX * scale, pt.pdfY * scale);
                        interCtx.stroke();
                    }
                }
                interCtx.restore();
            }
        }

        function endCanvasInteraction(e) {
            if (!isInteracting) return;
            isInteracting = false;
            interCtx.clearRect(0, 0, interactionCanvas.width, interactionCanvas.height);

            if (currentTool === 'draw' || currentTool === 'eraser') {
                if (activeStroke && activeStroke.points.length > 1) {
                    if (!pageDrawings[currentPage]) pageDrawings[currentPage] = [];
                    pageDrawings[currentPage].push(activeStroke);
                    recordAction({
                        type: 'draw_stroke',
                        page: currentPage,
                        stroke: activeStroke
                    });
                }
                activeStroke = null;
                renderDrawings(currentPage);
            } else if (['whiteout', 'redact', 'highlight', 'shape'].includes(currentTool)) {
                const pt = getPdfCoords(e);
                const x = Math.min(dragStartX, pt.pdfX);
                const y = Math.min(dragStartY, pt.pdfY);
                const w = Math.abs(pt.pdfX - dragStartX);
                const h = Math.abs(pt.pdfY - dragStartY);

                // Ignore accidental tiny clicks
                if (w > 5 && h > 5) {
                    let newAnno = null;
                    const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

                    if (currentTool === 'whiteout') {
                        newAnno = { id, type: 'whiteout', x, y, width: w, height: h, color: '#ffffff' };
                    } else if (currentTool === 'redact') {
                        newAnno = { id, type: 'redact', x, y, width: w, height: h, color: '#000000' };
                    } else if (currentTool === 'highlight') {
                        newAnno = { id, type: 'highlight', x, y, width: w, height: h, color: document.getElementById('hlColor').value, opacity: 0.35 };
                    } else if (currentTool === 'shape') {
                        const st = document.getElementById('shapeType').value;
                        newAnno = {
                            id,
                            type: st === 'circle' ? 'circle' : (st === 'line' || st === 'arrow' ? 'line' : 'rect'),
                            x, y, width: w, height: h,
                            strokeColor: document.getElementById('shapeStrokeColor').value,
                            fillColor: document.getElementById('shapeTransparentFill').checked ? 'transparent' : document.getElementById('shapeFillColor').value,
                            strokeWidth: parseInt(document.getElementById('shapeWidth').value) || 2,
                            isArrow: st === 'arrow'
                        };
                    }

                    if (newAnno) {
                        addAnnotation(currentPage, newAnno);
                        setTool('select');
                        selectAnno(newAnno.id);
                    }
                }
            }
        }

        // ========== IN-PLACE TEXT EDITING & SELECTION ENGINE ==========
        function createNewTextAt(pdfX, pdfY, initialText = 'Type text here...', initialFontSize = null) {
            const id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const fs = initialFontSize || parseInt(document.getElementById('fontSize').value) || 16;
            const col = document.getElementById('textColor').value;
            const fam = document.getElementById('fontFamily').value;
            const bold = document.getElementById('btnBold').classList.contains('active');
            const ital = document.getElementById('btnItalic').classList.contains('active');

            const newAnno = {
                id,
                type: 'text',
                x: pdfX,
                y: pdfY,
                width: 140,
                height: Math.max(26, fs * 1.4),
                text: initialText,
                fontSize: fs,
                fontFamily: fam,
                bold,
                italic: ital,
                color: col,
                align: 'left'
            };

            addAnnotation(currentPage, newAnno);
            setTool('select');
            selectAnno(newAnno.id);

            setTimeout(() => {
                const el = document.getElementById(newAnno.id);
                if (el) {
                    const inner = el.querySelector('.anno-text-inner');
                    if (inner) {
                        inner.focus();
                        selectAllText(inner);
                    }
                }
            }, 40);
            return newAnno;
        }

        // Direct in-place editing of existing PDF text:
        // Automatically masks the original canvas text with matching whiteout and spawns editable text right in place!
        function editTextSpanInPlace(span) {
            const canvasRect = pdfCanvas.getBoundingClientRect();
            const spanRect = span.getBoundingClientRect();

            const x = Math.max(0, (spanRect.left - canvasRect.left) / scale);
            const y = Math.max(0, (spanRect.top - canvasRect.top) / scale);
            const width = Math.max(24, spanRect.width / scale);
            const height = Math.max(14, spanRect.height / scale);
            const text = (span.textContent || '').trim();
            if (!text) return;

            // Detect computed font size from PDF.js span
            const computedStyle = window.getComputedStyle(span);
            const computedFontSize = parseFloat(computedStyle.fontSize) / scale;
            const fontSize = Math.max(8, Math.round(computedFontSize)) || 14;

            // 1. Add whiteout annotation to cover original text on canvas
            const whiteoutId = 'anno_wo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const whiteoutAnno = {
                id: whiteoutId,
                type: 'whiteout',
                x: Math.max(0, x - 1),
                y: Math.max(0, y - 1),
                width: width + 3,
                height: height + 2,
                color: '#ffffff'
            };

            // 2. Add editable text annotation right on top
            const textId = 'anno_txt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const textAnno = {
                id: textId,
                type: 'text',
                x: x,
                y: y,
                width: Math.max(width + 16, 60),
                height: height,
                text: text,
                fontSize: fontSize,
                fontFamily: 'Helvetica',
                color: '#000000',
                bold: false,
                italic: false,
                align: 'left'
            };

            // Record as composite action for single-step undo/redo
            recordAction({
                type: 'composite_edit',
                page: currentPage,
                items: [whiteoutAnno, textAnno]
            });

            if (!pageAnnotations[currentPage]) pageAnnotations[currentPage] = [];
            pageAnnotations[currentPage].push(whiteoutAnno);
            pageAnnotations[currentPage].push(textAnno);

            renderAnnotations(currentPage);

            setTool('select');
            selectAnno(textId);

            setTimeout(() => {
                const el = document.getElementById(textId);
                if (el) {
                    const inner = el.querySelector('.anno-text-inner');
                    if (inner) {
                        inner.focus();
                        selectAllText(inner);
                    }
                }
            }, 40);
        }

        // Listen for direct clicks on the PDF Text Layer
        textLayer.addEventListener('click', function (e) {
            const span = e.target.closest('span');
            if (span) {
                if (currentTool === 'text' || currentTool === 'select') {
                    e.preventDefault();
                    e.stopPropagation();
                    editTextSpanInPlace(span);
                }
                return;
            }

            // Clicked on blank space in text mode
            if (currentTool === 'text') {
                const pt = getPdfCoords(e);
                createNewTextAt(pt.pdfX, pt.pdfY);
            }
        });

        // Click on annotLayer empty space in text mode
        annotLayer.addEventListener('click', function (e) {
            if (currentTool !== 'text') return;
            if (e.target !== annotLayer) return;
            const pt = getPdfCoords(e);
            createNewTextAt(pt.pdfX, pt.pdfY);
        });

        function selectAllText(el) {
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // ========== TEXT SELECTION QUICK ACTION BAR ==========
        let activeSelectionRange = null;
        let activeSelectedText = '';

        canvasArea.addEventListener('mouseup', handleTextSelection);
        canvasArea.addEventListener('touchend', handleTextSelection);

        function handleTextSelection(e) {
            if (e && (e.target.closest('#selectionQuickBar') || e.target.closest('#floatingFormatBar'))) return;

            setTimeout(() => {
                const sel = window.getSelection();
                if (!sel || sel.isCollapsed || !sel.rangeCount) {
                    hideSelectionQuickBar();
                    return;
                }

                const text = sel.toString().trim();
                if (!text) {
                    hideSelectionQuickBar();
                    return;
                }

                const range = sel.getRangeAt(0);
                const rRect = range.getBoundingClientRect();
                const areaRect = canvasArea.getBoundingClientRect();

                if (rRect.width === 0 || rRect.height === 0) {
                    hideSelectionQuickBar();
                    return;
                }

                activeSelectionRange = range;
                activeSelectedText = text;

                selectionQuickBar.style.display = 'flex';
                selectionQuickBar.style.left = (rRect.left + rRect.width / 2) + 'px';
                selectionQuickBar.style.top = Math.max(areaRect.top + 10, rRect.top - 8) + 'px';
                lucide.createIcons({ root: selectionQuickBar });
            }, 30);
        }

        function hideSelectionQuickBar() {
            if (selectionQuickBar) selectionQuickBar.style.display = 'none';
            activeSelectionRange = null;
            activeSelectedText = '';
        }

        // Quick bar actions
        document.getElementById('qBtnEdit').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!activeSelectionRange) return;
            const rRect = activeSelectionRange.getBoundingClientRect();
            const canvasRect = pdfCanvas.getBoundingClientRect();

            const x = Math.max(0, (rRect.left - canvasRect.left) / scale);
            const y = Math.max(0, (rRect.top - canvasRect.top) / scale);
            const width = Math.max(20, rRect.width / scale);
            const height = Math.max(14, rRect.height / scale);

            const whiteoutId = 'anno_wo_' + Date.now();
            const whiteoutAnno = {
                id: whiteoutId,
                type: 'whiteout',
                x: Math.max(0, x - 1),
                y: Math.max(0, y - 1),
                width: width + 3,
                height: height + 2,
                color: '#ffffff'
            };

            const textId = 'anno_txt_' + Date.now();
            const textAnno = {
                id: textId,
                type: 'text',
                x: x,
                y: y,
                width: Math.max(width + 16, 60),
                height: height,
                text: activeSelectedText,
                fontSize: Math.max(8, Math.round(height * 0.85)) || 14,
                fontFamily: 'Helvetica',
                color: '#000000',
                bold: false,
                italic: false,
                align: 'left'
            };

            recordAction({ type: 'composite_edit', page: currentPage, items: [whiteoutAnno, textAnno] });
            if (!pageAnnotations[currentPage]) pageAnnotations[currentPage] = [];
            pageAnnotations[currentPage].push(whiteoutAnno);

        // ========== ANNOTATION MANAGEMENT & RENDERING ==========
        function getAnno(id) {
            for (const p in pageAnnotations) {
                const found = pageAnnotations[p].find(a => a.id === id);
                if (found) return found;
            }
            return null;
        }

        function addAnnotation(pageNum, anno) {
            if (!pageAnnotations[pageNum]) pageAnnotations[pageNum] = [];
            pageAnnotations[pageNum].push(anno);
            recordAction({ type: 'add_anno', page: pageNum, anno });
            renderAnnotations(pageNum);
        }

        function removeAnnotation(pageNum, id) {
            const list = pageAnnotations[pageNum] || [];
            const idx = list.findIndex(a => a.id === id);
            if (idx !== -1) {
                const removed = list.splice(idx, 1)[0];
                recordAction({ type: 'remove_anno', page: pageNum, anno: removed, index: idx });
                if (selectedAnnoId === id) {
                    deselectAnno();
                }
                renderAnnotations(pageNum);
            }
        }

            clone.id = 'anno_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            clone.x += 15;
            clone.y += 15;
            addAnnotation(currentPage, clone);

        function selectAnno(id) {
            selectedAnnoId = id;

                    document.getElementById('textColor').value = item.color || '#000000';
                    document.getElementById('btnBold').classList.toggle('active', !!item.bold);
                    document.getElementById('btnItalic').classList.toggle('active', !!item.italic);

                    document.getElementById('hlColor').value = item.color || '#facc15';
                }

            updateFloatingFormatBar();

        function deselectAnno() {

        function renderAnnotations(pageNum) {
            annotLayer.innerHTML = '';
            const list = pageAnnotations[pageNum] || [];

            list.forEach(item => {
                const el = document.createElement('div');
                el.id = item.id;
                el.className = 'anno-item';
                if (item.id === selectedAnnoId) el.classList.add('selected');

                el.style.left = (item.x * scale) + 'px';
                el.style.top = (item.y * scale) + 'px';
                el.style.width = (item.width * scale) + 'px';
                el.style.height = (item.height * scale) + 'px';

                if (item.type === 'text') {
                    el.classList.add('anno-text-box');
                    const inner = document.createElement('div');
                    inner.className = 'anno-text-inner';
                    inner.contentEditable = 'true';
                    inner.spellcheck = false;
                    inner.innerText = item.text || '';
                    inner.style.fontSize = ((item.fontSize || 16) * scale) + 'px';
                    inner.style.fontFamily = item.fontFamily === 'Courier' ? 'Courier, monospace' : (item.fontFamily === 'Times' ? 'Times New Roman, serif' : 'Helvetica, Arial, sans-serif');
                    inner.style.color = item.color || '#000000';
                    inner.style.fontWeight = item.bold ? 'bold' : 'normal';
                    inner.style.fontStyle = item.italic ? 'italic' : 'normal';
                    inner.style.textAlign = item.align || 'left';

                    inner.addEventListener('input', () => {
                        item.text = inner.innerText;
                        const clientH = inner.offsetHeight / scale;
                        if (clientH > item.height) {
                            item.height = clientH;
                            el.style.height = (item.height * scale) + 'px';
                        }
                    });

                    inner.addEventListener('focus', () => {
                        selectAnno(item.id);
                    });

                    el.appendChild(inner);
                } else if (item.type === 'whiteout') {
                    el.classList.add('anno-whiteout');
                    el.style.background = '#ffffff';
                } else if (item.type === 'redact') {
                    el.classList.add('anno-redact');
                    el.style.background = '#000000';
                } else if (item.type === 'highlight') {
                    el.classList.add('anno-highlight');
                    el.style.backgroundColor = item.color || '#facc15';
                    el.style.opacity = item.opacity || 0.35;
                } else if (item.type === 'image') {
                    el.classList.add('anno-image');
                    const img = document.createElement('img');
                    img.src = item.dataUrl;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'contain';
                    img.draggable = false;
                    el.appendChild(img);
                } else if (item.type === 'rect') {
                    el.classList.add('anno-shape-rect');
                    el.style.borderColor = item.strokeColor || '#2563eb';
                    el.style.borderWidth = ((item.strokeWidth || 2) * scale) + 'px';
                    el.style.backgroundColor = (item.fillColor && item.fillColor !== 'transparent') ? item.fillColor : 'transparent';
                } else if (item.type === 'circle') {
                    el.classList.add('anno-shape-circle');
                    el.style.borderColor = item.strokeColor || '#2563eb';
                    el.style.borderWidth = ((item.strokeWidth || 2) * scale) + 'px';
                    el.style.backgroundColor = (item.fillColor && item.fillColor !== 'transparent') ? item.fillColor : 'transparent';
                } else if (item.type === 'line') {
                    el.style.borderTop = `${(item.strokeWidth || 2) * scale}px solid ${item.strokeColor || '#2563eb'}`;
                }

                // Add 8 resize handles
                ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(h => {
                    const handle = document.createElement('div');
                    handle.className = `anno-handle ${h}`;
                    handle.dataset.handle = h;
                    el.appendChild(handle);
                });

                makeSelectableAndMovable(el, item);
                annotLayer.appendChild(el);
            });

            if (selectedAnnoId) {
                updateFloatingFormatBar();
            }
        }

        // ========== DRAGGING & RESIZING ANNOTATIONS ==========
        function makeSelectableAndMovable(el, item) {
            let mode = null; // 'move' or handle position 'nw', 'se', etc.
            let startClientX = 0, startClientY = 0;
            let origX = 0, origY = 0, origW = 0, origH = 0;

            el.addEventListener('mousedown', onPointerDown);
            el.addEventListener('touchstart', onPointerDown, { passive: false });

            function onPointerDown(e) {
                if (currentTool !== 'select' && currentTool !== 'text') return;
                // If user is clicking directly into text to edit, don't drag
                if (e.target.classList.contains('anno-text-inner') && e.type === 'mousedown') {
                    selectAnno(item.id);
                    return;
                }
                if (e.target.closest('.anno-actions-bar')) return;

                e.stopPropagation();
                selectAnno(item.id);

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                if (e.target.classList.contains('anno-handle')) {
                    mode = e.target.dataset.handle;
                } else {
                    mode = 'move';
                }

                startClientX = clientX;
                startClientY = clientY;
                origX = item.x;
                origY = item.y;
                origW = item.width;
                origH = item.height;

                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('touchmove', onPointerMove, { passive: false });
                window.addEventListener('mouseup', onPointerUp);
                window.addEventListener('touchend', onPointerUp);
            }

            function onPointerMove(e) {
                if (!mode) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = (clientX - startClientX) / scale;
                const dy = (clientY - startClientY) / scale;

                if (mode === 'move') {
                    item.x = Math.max(0, origX + dx);
                    item.y = Math.max(0, origY + dy);
                    el.style.left = (item.x * scale) + 'px';
                    el.style.top = (item.y * scale) + 'px';
                } else {
                    // Resize via handle
                    let newX = origX;
                    let newY = origY;
                    let newW = origW;
                    let newH = origH;

                    if (mode.includes('e')) newW = Math.max(20, origW + dx);
                    if (mode.includes('s')) newH = Math.max(15, origH + dy);
                    if (mode.includes('w')) {
                        const candidateW = origW - dx;
                        if (candidateW > 20) {
                            newW = candidateW;
                            newX = origX + dx;
                        }
                    }
                    if (mode.includes('n')) {
                        const candidateH = origH - dy;
                        if (candidateH > 15) {
                            newH = candidateH;
                            newY = origY + dy;
                        }
                    }

                    item.x = newX;
                    item.y = newY;
                    item.width = newW;
                    item.height = newH;

                    el.style.left = (item.x * scale) + 'px';
                    el.style.top = (item.y * scale) + 'px';
                    el.style.width = (item.width * scale) + 'px';
                    el.style.height = (item.height * scale) + 'px';
                }
            }

            function onPointerUp() {
                if (mode) {
                    recordAction({
                        type: 'modify_anno',
                        page: currentPage,
                        id: item.id,
                        prev: { x: origX, y: origY, width: origW, height: origH },
                        curr: { x: item.x, y: item.y, width: item.width, height: item.height }
                    });
                }
                mode = null;
                window.removeEventListener('mousemove', onPointerMove);
                window.removeEventListener('touchmove', onPointerMove);
                window.removeEventListener('mouseup', onPointerUp);
                window.removeEventListener('touchend', onPointerUp);
            }
        }

        function renderTypedSig() {
            const canvas = document.getElementById('sigTypePreview');
            const ctx = canvas.getContext('2d');
            const text = document.getElementById('sigTypeInput').value || 'Your Signature';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111';
            ctx.font = `52px '${currentSigFont}', cursive, serif`;
            ctx.textBaseline = 'middle';

        function renderUploadedSig() {
            const canvas = document.getElementById('sigUploadPreview');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = uploadedSigImg.naturalWidth;
            canvas.height = uploadedSigImg.naturalHeight;
            canvas.style.maxHeight = '150px';
            canvas.style.objectFit = 'contain';

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(uploadedSigImg, 0, 0);

            if (document.getElementById('sigRemoveBg').checked) {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                const tol = parseInt(document.getElementById('sigBgTolerance').value) || 180;
                const makeBlack = document.getElementById('sigMakeBlack').checked;

                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    const brightness = (r + g + b) / 3;
                    if (brightness > tol) {
                        data[i + 3] = 0; // Transparent
                    } else if (makeBlack) {
                        data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
                        data[i + 3] = Math.max(0, Math.min(255, 255 - ((brightness / tol) * 255)));
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            }
        }

        function resetUploadState() {

        // Signature Canvas Drawing
        let activeSigStroke = null;
        function getSigCanvasPos(e) {
            const r = sigCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - r.left) * (sigCanvas.width / r.width),
                y: (clientY - r.top) * (sigCanvas.height / r.height)
            };
        }

        sigCanvas.addEventListener('mousedown', e => {
            isSigning = true;

        });
        sigCanvas.addEventListener('mousemove', e => {
            if (!isSigning || !activeSigStroke) return;
            const p = getSigCanvasPos(e);
            activeSigStroke.points.push(p);
            sigCtx.strokeStyle = activeSigStroke.color;
            sigCtx.lineWidth = 2.5;
            sigCtx.lineCap = 'round';
            sigCtx.beginPath();
            sigCtx.moveTo(sigLastX, sigLastY);
            sigCtx.lineTo(p.x, p.y);
            sigCtx.stroke();
            sigLastX = p.x; sigLastY = p.y;

        window.addEventListener('mouseup', () => {

        // ========== UNDO / REDO ==========
        document.getElementById('undoBtn').addEventListener('click', performUndo);

        function performUndo() {
            const action = undoHistory.pop();
            if (!action) return;
            redoHistory.push(action);

            if (action.type === 'add_anno') {
                const list = pageAnnotations[action.page] || [];
                const idx = list.findIndex(a => a.id === action.anno.id);
                if (idx !== -1) list.splice(idx, 1);
            } else if (action.type === 'remove_anno') {
                if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
                pageAnnotations[action.page].splice(action.index, 0, action.anno);
            } else if (action.type === 'modify_anno') {
                const item = getAnno(action.id);
                if (item) {
                    Object.assign(item, action.prev);
                }
            } else if (action.type === 'draw_stroke') {
                const strokes = pageDrawings[action.page];
                if (strokes && strokes.length > 0) strokes.pop();
            } else if (action.type === 'composite_edit') {
                const list = pageAnnotations[action.page] || [];
                action.items.forEach(it => {
                    const idx = list.findIndex(a => a.id === it.id);
                    if (idx !== -1) list.splice(idx, 1);
                });
            }

            updateUndoRedoBtns();
            renderPage(currentPage);
        }

        function performRedo() {
            const action = redoHistory.pop();
            if (!action) return;
            undoHistory.push(action);

            if (action.type === 'add_anno') {
                if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
                pageAnnotations[action.page].push(action.anno);
            } else if (action.type === 'remove_anno') {
                const list = pageAnnotations[action.page] || [];
                const idx = list.findIndex(a => a.id === action.anno.id);
                if (idx !== -1) list.splice(idx, 1);
            } else if (action.type === 'modify_anno') {
                const item = getAnno(action.id);
                if (item) {
                    Object.assign(item, action.curr);
                }
            } else if (action.type === 'draw_stroke') {
                if (!pageDrawings[action.page]) pageDrawings[action.page] = [];
                pageDrawings[action.page].push(action.stroke);
            } else if (action.type === 'composite_edit') {
                if (!pageAnnotations[action.page]) pageAnnotations[action.page] = [];
                action.items.forEach(it => {
                    pageAnnotations[action.page].push(it);
                });
            }

            updateUndoRedoBtns();
            renderPage(currentPage);
        }

            const isEditingText = e.target.isContentEditable || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

            if ((e.key === 'Delete' || e.key === 'Backspace') && !isEditingText) {
                if (selectedAnnoId) {
                    e.preventDefault();
                    deleteSelected();
                }
            } else if (e.key === 'Escape') {
                deselectAnno();
                setTool('select');
                closeFindDialog();
            } else if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z' || e.key === 'Z') {
                    if (e.shiftKey) {
                        e.preventDefault();
                        performRedo();
                    } else if (!isEditingText) {
                        e.preventDefault();
                        performUndo();
                    }
                } else if ((e.key === 'y' || e.key === 'Y') && !isEditingText) {
                    e.preventDefault();
                    performRedo();
                } else if ((e.key === 'd' || e.key === 'D') && selectedAnnoId && !isEditingText) {
                    e.preventDefault();

        // ========== PAGE OPERATIONS & THUMBNAILS ==========
        function rotatePage(pageNum) {
            const current = pageRotations[pageNum] || 0;
            pageRotations[pageNum] = (current + 90) % 360;
            if (currentPage === pageNum) {
                renderPage(pageNum);
            }
            buildThumbnails();
            showToast(`Page ${pageNum} rotated 90°`);
        }

        function deletePage(pageNum) {
            const total = (pdfDoc ? pdfDoc.numPages : 0) + addedBlankPages.length;
            const remaining = total - deletedPages.size;
            if (remaining <= 1) {
                alert('Cannot delete the only remaining page.');
                return;
            }
            if (!confirm(`Are you sure you want to delete Page ${pageNum}?`)) return;

            deletedPages.add(pageNum);
            if (currentPage === pageNum) {
                let next = 1;
                while (next <= total && deletedPages.has(next)) next++;
                if (next <= total) {
                    pageTo(next);
                } else {
                    let prev = total;
                    while (prev >= 1 && deletedPages.has(prev)) prev--;
                    if (prev >= 1) pageTo(prev);
                }
            }
            buildThumbnails();
            showToast(`Page ${pageNum} deleted`);
        }

        async function buildThumbnails() {

                header.appendChild(actions);

                // Canvas preview
                const tc = document.createElement('canvas');
                if (i <= pdfDoc.numPages) {
                    const page = await pdfDoc.getPage(i);
                    const extraRot = pageRotations[i] || 0;
                    const rot = (page.rotate + extraRot) % 360;
                    const vp = page.getViewport({ scale: 0.18, rotation: rot });
                    tc.width = Math.floor(vp.width);
                    tc.height = Math.floor(vp.height);
                    await page.render({ canvasContext: tc.getContext('2d'), viewport: vp }).promise.catch(() => {});
                } else {
                    tc.width = Math.floor(595 * 0.18);
                    tc.height = Math.floor(842 * 0.18);
                    const tctx = tc.getContext('2d');
                    tctx.fillStyle = '#ffffff';
                    tctx.fillRect(0, 0, tc.width, tc.height);
                    tctx.strokeStyle = '#cbd5e1';
                    tctx.strokeRect(0, 0, tc.width, tc.height);

                item.appendChild(tc);

            // Append "+ Add Blank Page" button
