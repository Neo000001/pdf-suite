        // ========== FIND & REPLACE ENGINE ==========
        let findMatches = [];
        let currentMatchIdx = -1;

        findBtn.addEventListener('click', openFindDialog);
        document.getElementById('frCloseBtn').addEventListener('click', closeFindDialog);

        function openFindDialog() {
            findReplaceDialog.classList.add('open');
            const inp = document.getElementById('frFindInput');
            inp.focus();
            if (inp.value.trim()) {
                executeFind(inp.value.trim());

        function closeFindDialog() {
            findReplaceDialog.classList.remove('open');
            clearFindHighlights();
        }

        const frFindInput = document.getElementById('frFindInput');
        let findDebounceTimer = null;
        frFindInput.addEventListener('input', () => {
            clearTimeout(findDebounceTimer);
            findDebounceTimer = setTimeout(() => {
                executeFind(frFindInput.value.trim());
            }, 250);
        });

        frFindInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (e.shiftKey) {
                    goToMatch(currentMatchIdx - 1);
                } else {
                    goToMatch(currentMatchIdx + 1);
                }
            } else if (e.key === 'Escape') {
                closeFindDialog();

        async function executeFind(query) {
            findMatches = [];
            currentMatchIdx = -1;
            const countLabel = document.getElementById('frMatchCount');

            if (!query || !pdfDoc) {
                countLabel.textContent = '0 / 0';
                clearFindHighlights();
                return;
            }

            const lowerQuery = query.toLowerCase();
            const total = pdfDoc.numPages;

            for (let p = 1; p <= total; p++) {
                if (deletedPages.has(p)) continue;
                const page = await pdfDoc.getPage(p);
                const textContent = await page.getTextContent();
                const vp = page.getViewport({ scale: 1.0 });

                textContent.items.forEach(item => {
                    const str = item.str || '';
                    const lowerStr = str.toLowerCase();
                    let startIdx = 0;

                    while ((startIdx = lowerStr.indexOf(lowerQuery, startIdx)) !== -1) {
                        const tx = item.transform[4];
                        const ty = item.transform[5];
                        const fontSize = Math.abs(item.transform[0]) || Math.abs(item.transform[3]) || 12;
                        const approxCharWidth = item.width > 0 ? (item.width / str.length) : (fontSize * 0.55);
                        const matchX = tx + (startIdx * approxCharWidth);
                        const matchW = approxCharWidth * query.length;
                        const matchH = fontSize * 1.2;
                        const matchY = vp.height - ty - fontSize;

                        findMatches.push({
                            pageNum: p,
                            matchedText: str.substr(startIdx, query.length),
                            bounds: {
                                x: Math.max(0, matchX),
                                y: Math.max(0, matchY),
                                width: Math.max(12, matchW),
                                height: Math.max(10, matchH),
                                fontSize: Math.round(fontSize)
                            }
                        });
                        startIdx += query.length;
                    }
                });
            }

            if (findMatches.length > 0) {
                goToMatch(0);
            } else {
                countLabel.textContent = '0 / 0';
                clearFindHighlights();
            }
        }

        function goToMatch(idx) {
            if (findMatches.length === 0) {
                document.getElementById('frMatchCount').textContent = '0 / 0';
                return;
            }
            if (idx < 0) idx = findMatches.length - 1;
            if (idx >= findMatches.length) idx = 0;
            currentMatchIdx = idx;

            document.getElementById('frMatchCount').textContent = `${currentMatchIdx + 1} / ${findMatches.length}`;
            const match = findMatches[currentMatchIdx];

            if (match.pageNum !== currentPage) {
                pageTo(match.pageNum).then(() => {
                    highlightMatchOnCanvas(match);
                });
            } else {
                highlightMatchOnCanvas(match);
            }
        }

        function highlightMatchOnCanvas(match) {
            clearFindHighlights();
            const b = match.bounds;
            const highlightBox = document.createElement('div');
            highlightBox.id = 'activeFindHighlight';
            highlightBox.style.cssText = `position:absolute;left:${b.x * scale}px;top:${b.y * scale}px;width:${b.width * scale}px;height:${b.height * scale}px;border:2px solid #2563eb;background:rgba(250,204,21,0.45);pointer-events:none;z-index:90;border-radius:3px;box-shadow:0 0 10px rgba(37,99,235,0.5);`;
            annotLayer.appendChild(highlightBox);

            const areaRect = canvasArea.getBoundingClientRect();
            const matchTop = b.y * scale;
            if (matchTop < canvasArea.scrollTop || matchTop > canvasArea.scrollTop + areaRect.height - 80) {
                canvasArea.scrollTo({ top: Math.max(0, matchTop - 120), behavior: 'smooth' });
            }
        }

        function clearFindHighlights() {
            const h = document.getElementById('activeFindHighlight');
            if (h) h.remove();
        }

        document.getElementById('frPrevBtn').addEventListener('click', () => goToMatch(currentMatchIdx - 1));
        document.getElementById('frNextBtn').addEventListener('click', () => goToMatch(currentMatchIdx + 1));

        document.getElementById('frReplaceBtn').addEventListener('click', () => {
            if (currentMatchIdx < 0 || currentMatchIdx >= findMatches.length) return;
            const replaceWith = document.getElementById('frReplaceInput').value;
            const match = findMatches[currentMatchIdx];

            applyMatchReplacement(match, replaceWith);
            findMatches.splice(currentMatchIdx, 1);
            if (findMatches.length > 0) {
                goToMatch(currentMatchIdx % findMatches.length);
            } else {
                document.getElementById('frMatchCount').textContent = '0 / 0';
                clearFindHighlights();
                showToast('All matches replaced');
            }
        });

        document.getElementById('frReplaceAllBtn').addEventListener('click', () => {
            if (findMatches.length === 0) return;
            const replaceWith = document.getElementById('frReplaceInput').value;
            const count = findMatches.length;

            findMatches.forEach(match => {
                applyMatchReplacement(match, replaceWith);
            });

            findMatches = [];
            currentMatchIdx = -1;
            document.getElementById('frMatchCount').textContent = '0 / 0';
            clearFindHighlights();
            showToast(`Replaced ${count} occurrence${count > 1 ? 's' : ''}`);
        });

        function applyMatchReplacement(match, newText) {
            const b = match.bounds;
            const p = match.pageNum;

            const whiteoutAnno = {
                id: 'anno_wo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                type: 'whiteout',
                x: Math.max(0, b.x - 1),
                y: Math.max(0, b.y - 1),
                width: b.width + 4,
                height: b.height + 2,
                color: '#ffffff'
            };

            const textAnno = {
                id: 'anno_txt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                type: 'text',
                x: b.x,
                y: b.y,
                width: Math.max(b.width + 10, 40),
                height: b.height,
                text: newText,
                fontSize: b.fontSize || 14,
                fontFamily: 'Helvetica',
                color: '#000000',
                bold: false,
                italic: false,
                align: 'left'
            };

            recordAction({ type: 'composite_edit', page: p, items: [whiteoutAnno, textAnno] });
            if (!pageAnnotations[p]) pageAnnotations[p] = [];
            pageAnnotations[p].push(whiteoutAnno);
            pageAnnotations[p].push(textAnno);

            if (p === currentPage) {
                renderAnnotations(currentPage);
            }
        }

        // ========== EXPORT PDF WITH PDF-LIB ==========
        // Helper: convert characters outside WinAnsi to safe equivalents so pdf-lib never throws
        function sanitizeWinAnsi(str) {
            if (!str) return '';
            return str
                .replace(/[\u2018\u2019]/g, "'")
                .replace(/[\u201C\u201D]/g, '"')
                .replace(/[\u2013\u2014]/g, '-')
                .replace(/[\u2022\u2023]/g, '*')
                .replace(/[\u2026]/g, '...')
                .replace(/[^\x00-\xFF]/g, ' '); // Strip non-latin1 if unsupported
        }

        function hexToRgb(hex) {
            if (!hex) return { r: 0, g: 0, b: 0 };
            const clean = hex.replace('#', '');
            const num = parseInt(clean, 16);
            if (clean.length === 6) {
                return {
                    r: ((num >> 16) & 255) / 255,
                    g: ((num >> 8) & 255) / 255,
                    b: (num & 255) / 255
                };
            }
            return { r: 0, g: 0, b: 0 };
        }

        exportBtn.addEventListener('click', async () => {
            if (!originalPdfBytes) return;
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> Exporting...';

            try {
                const { PDFDocument, rgb, StandardFonts, degrees } = PDFLib;
                const srcDoc = await PDFDocument.load(originalPdfBytes);
                const pdfLibDoc = await PDFDocument.create();

                // Pre-embed standard fonts
                const fonts = {
                    Helvetica: await pdfLibDoc.embedFont(StandardFonts.Helvetica),
                    HelveticaBold: await pdfLibDoc.embedFont(StandardFonts.HelveticaBold),
                    HelveticaOblique: await pdfLibDoc.embedFont(StandardFonts.HelveticaOblique),
                    HelveticaBoldOblique: await pdfLibDoc.embedFont(StandardFonts.HelveticaBoldOblique),
                    Times: await pdfLibDoc.embedFont(StandardFonts.TimesRoman),
                    TimesBold: await pdfLibDoc.embedFont(StandardFonts.TimesRomanBold),
                    TimesItalic: await pdfLibDoc.embedFont(StandardFonts.TimesRomanItalic),
                    TimesBoldItalic: await pdfLibDoc.embedFont(StandardFonts.TimesRomanBoldItalic),
                    Courier: await pdfLibDoc.embedFont(StandardFonts.Courier),
                    CourierBold: await pdfLibDoc.embedFont(StandardFonts.CourierBold),
                    CourierOblique: await pdfLibDoc.embedFont(StandardFonts.CourierOblique),
                    CourierBoldOblique: await pdfLibDoc.embedFont(StandardFonts.CourierBoldOblique)
                };

                const totalOriginal = srcDoc.getPageCount();

                // 1. Process original pages (skipping deleted ones)
                for (let origP = 1; origP <= totalOriginal; origP++) {
                    if (deletedPages.has(origP)) continue;

                    const [copiedPage] = await pdfLibDoc.copyPages(srcDoc, [origP - 1]);
                    const page = pdfLibDoc.addPage(copiedPage);

                    const extraRot = pageRotations[origP] || 0;
                    if (extraRot !== 0) {
                        const curRot = page.getRotation().angle || 0;
                        page.setRotation(degrees((curRot + extraRot) % 360));
                    }

                    await exportLayersForPage(pdfLibDoc, page, origP, fonts);
                }

                // 2. Process added blank pages
                for (const blank of addedBlankPages) {
                    if (deletedPages.has(blank.pageNum)) continue;

                    const page = pdfLibDoc.addPage([blank.width || 595, blank.height || 842]);
                    const extraRot = pageRotations[blank.pageNum] || 0;
                    if (extraRot !== 0) {
                        page.setRotation(degrees(extraRot % 360));
                    }

                    await exportLayersForPage(pdfLibDoc, page, blank.pageNum, fonts);
                }

                // Save PDF and trigger download
                const modifiedBytes = await pdfLibDoc.save();
                const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `Edited_${originalFileName}`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(downloadUrl);
                }, 500);

            } catch (err) {
                console.error(err);
                alert('Export failed: ' + (err.message || 'Unknown error occurred while generating PDF.'));
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = '<i data-lucide="download" style="width:16px;height:16px"></i> Export PDF';
                lucide.createIcons();
            }
        });

        async function exportLayersForPage(pdfLibDoc, page, pageNum, fonts) {
            const { rgb } = PDFLib;
            const { width: pageWidth, height: pageHeight } = page.getSize();
            const rotation = page.getRotation().angle || 0;

            const annotations = pageAnnotations[pageNum] || [];
            const drawings = pageDrawings[pageNum] || [];

            function mapCoord(item) {
                let x = item.x;
                let y = item.y;
                let w = item.width;
                let h = item.height;

                if (rotation === 0) {
                    return { x: x, y: pageHeight - y - h, width: w, height: h };
                } else if (rotation === 90) {
                    return { x: y, y: x, width: h, height: w };
                } else if (rotation === 180) {
                    return { x: pageWidth - x - w, y: y, width: w, height: h };
                } else if (rotation === 270) {
                    return { x: pageWidth - y - h, y: pageHeight - x - w, width: h, height: w };
                }
                return { x, y: pageHeight - y - h, width: w, height: h };
            }

            // 1) WHITEOUT & REDACT
            for (const a of annotations) {
                if (a.type === 'whiteout' || a.type === 'redact') {
                    const c = mapCoord(a);
                    const fill = a.type === 'whiteout' ? rgb(1, 1, 1) : rgb(0, 0, 0);
                    page.drawRectangle({
                        x: c.x,
                        y: c.y,
                        width: c.width,
                        height: c.height,
                        color: fill,
                        opacity: 1
                    });
                }
            }

            // 2) SHAPES
            for (const a of annotations) {
                if (a.type === 'rect' || a.type === 'circle' || a.type === 'line') {
                    const c = mapCoord(a);
                    const strk = hexToRgb(a.strokeColor);
                    const hasFill = a.fillColor && a.fillColor !== 'transparent';
                    const fColor = hasFill ? hexToRgb(a.fillColor) : undefined;

                    if (a.type === 'rect') {
                        page.drawRectangle({
                            x: c.x,
                            y: c.y,
                            width: c.width,
                            height: c.height,
                            borderColor: rgb(strk.r, strk.g, strk.b),
                            borderWidth: a.strokeWidth || 2,
                            color: hasFill ? rgb(fColor.r, fColor.g, fColor.b) : undefined
                        });
                    } else if (a.type === 'circle') {
                        page.drawEllipse({
                            x: c.x + c.width / 2,
                            y: c.y + c.height / 2,
                            xScale: c.width / 2,
                            yScale: c.height / 2,
                            borderColor: rgb(strk.r, strk.g, strk.b),
                            borderWidth: a.strokeWidth || 2,
                            color: hasFill ? rgb(fColor.r, fColor.g, fColor.b) : undefined
                        });
                    } else if (a.type === 'line') {
                        page.drawLine({
                            start: { x: c.x, y: c.y + c.height },
                            end: { x: c.x + c.width, y: c.y },
                            color: rgb(strk.r, strk.g, strk.b),
                            thickness: a.strokeWidth || 2
                        });
                    }
                }
            }

            // 3) HIGHLIGHTS
            for (const a of annotations) {
                if (a.type === 'highlight') {
                    const c = mapCoord(a);
                    const hl = hexToRgb(a.color);
                    page.drawRectangle({
                        x: c.x,
                        y: c.y,
                        width: c.width,
                        height: c.height,
                        color: rgb(hl.r, hl.g, hl.b),
                        opacity: a.opacity || 0.35
                    });
                }
            }

            // 4) FREEHAND DRAWINGS
            if (drawings.length > 0) {
                const drawExportCanvas = document.createElement('canvas');
                const resMult = 2;
                drawExportCanvas.width = Math.floor(pageWidth * resMult);
                drawExportCanvas.height = Math.floor(pageHeight * resMult);
                const dCtx = drawExportCanvas.getContext('2d');
                dCtx.scale(resMult, resMult);

                drawings.forEach(s => {
                    if (!s.points || s.points.length === 0) return;
                    dCtx.save();
                    dCtx.lineCap = 'round';
                    dCtx.lineJoin = 'round';
                    if (s.tool === 'eraser') {
                        dCtx.globalCompositeOperation = 'destination-out';
                        dCtx.lineWidth = (s.size || 15);
                    } else {
                        dCtx.globalCompositeOperation = 'source-over';
                        dCtx.strokeStyle = s.color || '#ef4444';
                        dCtx.lineWidth = (s.size || 3);
                    }
                    dCtx.beginPath();
                    dCtx.moveTo(s.points[0].x, s.points[0].y);
                    for (let i = 1; i < s.points.length; i++) {
                        dCtx.lineTo(s.points[i].x, s.points[i].y);
                    }
                    dCtx.stroke();
                    dCtx.restore();
                });

                const pngDataUrl = drawExportCanvas.toDataURL('image/png');
                const pngBytes = await fetch(pngDataUrl).then(r => r.arrayBuffer());
                const embeddedPng = await pdfLibDoc.embedPng(pngBytes);
                page.drawImage(embeddedPng, {
                    x: 0,
                    y: 0,
                    width: pageWidth,
                    height: pageHeight
                });
            }

            // 5) IMAGES AND SIGNATURES
            for (const a of annotations) {
                if (a.type === 'image' && a.dataUrl) {
                    try {
                        const c = mapCoord(a);
                        const imgBytes = await fetch(a.dataUrl).then(r => r.arrayBuffer());
                        const isJpeg = a.dataUrl.startsWith('data:image/jpeg') || a.dataUrl.startsWith('data:image/jpg');
                        const embedded = isJpeg ? await pdfLibDoc.embedJpg(imgBytes) : await pdfLibDoc.embedPng(imgBytes);

                        page.drawImage(embedded, {
                            x: c.x,
                            y: c.y,
                            width: c.width,
                            height: c.height
                        });
                    } catch (e) {
                        console.warn('Failed to embed image annotation:', e);
                    }
                }
            }

            // 6) TEXT ANNOTATIONS
            for (const a of annotations) {
                if (a.type === 'text' && a.text) {
                    const c = mapCoord(a);
                    const col = hexToRgb(a.color);
                    const fs = a.fontSize || 16;

                    let fontKey = 'Helvetica';
                    if (a.fontFamily === 'Times') {
                        fontKey = a.bold && a.italic ? 'TimesBoldItalic' : (a.bold ? 'TimesBold' : (a.italic ? 'TimesItalic' : 'Times'));
                    } else if (a.fontFamily === 'Courier') {
                        fontKey = a.bold && a.italic ? 'CourierBoldOblique' : (a.bold ? 'CourierBold' : (a.italic ? 'CourierOblique' : 'Courier'));
                    } else {
                        fontKey = a.bold && a.italic ? 'HelveticaBoldOblique' : (a.bold ? 'HelveticaBold' : (a.italic ? 'HelveticaOblique' : 'Helvetica'));
                    }
                    const font = fonts[fontKey] || fonts.Helvetica;

                    const lines = a.text.split('\n');
                    const lineHeight = fs * 1.25;

                    lines.forEach((rawLine, idx) => {
                        const sanitized = sanitizeWinAnsi(rawLine);
                        if (!sanitized) return;

                        let lineX = c.x;
                        if (a.align === 'center' || a.align === 'right') {
                            const textW = font.widthOfTextAtSize(sanitized, fs);
                            if (a.align === 'center') {
                                lineX = c.x + (c.width - textW) / 2;
                            } else if (a.align === 'right') {
                                lineX = c.x + (c.width - textW);
                            }
                        }

                        const baselineY = c.y + c.height - (fs * 0.85) - (idx * lineHeight);

                        page.drawText(sanitized, {
                            x: lineX,
                            y: baselineY,
                            size: fs,
                            font: font,
                            color: rgb(col.r, col.g, col.b)
                        });
                    });
                }
            }
        }
    </script>
