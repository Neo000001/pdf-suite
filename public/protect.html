        (function () {
            const savedTheme = localStorage.getItem('pdfsuite-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const hour = new Date().getHours();
                const theme = (hour >= 6 && hour < 18) ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
    </script>

        <h1>Watermark & Protect PDF</h1>
        <p>Permanently embed watermarks across all pages of your PDF to protect them from theft.</p>
        <div class="upload-box" id="uploadBox">

    <script>
        lucide.createIcons();

        const fileInput = document.getElementById('fileInput');

        const uploadBox = document.getElementById('uploadBox');

        const actionArea = document.getElementById('actionArea');

        const processBtn = document.getElementById('processBtn');

        const statusMsg = document.getElementById('statusMsg');

        const fileInfo = document.getElementById('fileInfo');

        const watermarkTextInput = document.getElementById('watermarkText');

        const watermarkColorInput = document.getElementById('watermarkColor');



        let currentPdfBytes = null;

        async function renderPDFPreview(arrayBuffer) {
            const pdfPreviewSection = document.getElementById('pdfPreviewSection');
            const pdfPagesWrap = document.getElementById('pdfPagesWrap');
            const previewPageCount = document.getElementById('previewPageCount');

            pdfPagesWrap.innerHTML = '';
            pdfPreviewSection.style.display = 'block';

            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const total = pdf.numPages;
                previewPageCount.textContent = total + ' page' + (total !== 1 ? 's' : '');

                for (let p = 1; p <= total; p++) {
                    const page = await pdf.getPage(p);
                    const viewport = page.getViewport({ scale: 1.2 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.className = 'pdf-page-canvas';
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport }).promise;

                    const label = document.createElement('p');
                    label.className = 'pdf-page-label';
                    label.textContent = 'Page ' + p;

                    pdfPagesWrap.appendChild(canvas);
                    pdfPagesWrap.appendChild(label);
                }
            } catch (e) {
                pdfPreviewSection.style.display = 'none';
                console.warn('PDF preview failed:', e);
            }
        }


        let fileName = '';



        uploadBox.addEventListener('click', () => fileInput.click());



        fileInput.addEventListener('change', async (e) => {

            const file = e.target.files[0];

            if (file) {

                currentPdfBytes = await file.arrayBuffer();
            renderPDFPreview(currentPdfBytes.slice(0));

                fileName = file.name;

                uploadBox.style.display = 'none';

                actionArea.style.display = 'block';

                fileInfo.innerText = `Selected: ${fileName}`;

            }

        });



        const watermarkOpacityInput = document.getElementById('watermarkOpacity');
        const opacityVal = document.getElementById('opacityVal');
        const watermarkAngleInput = document.getElementById('watermarkAngle');

        if (watermarkOpacityInput && opacityVal) {
            watermarkOpacityInput.addEventListener('input', () => {
                opacityVal.innerText = watermarkOpacityInput.value + '%';
            });
        }

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                watermarkTextInput.value = btn.dataset.preset;
            });
        });

        processBtn.addEventListener('click', async () => {
            try {
                processBtn.disabled = true;
                processBtn.innerText = "Processing Document...";

                const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
                const doc = await PDFDocument.load(currentPdfBytes);

                const text = watermarkTextInput.value.trim();

                if (text.length > 0) {
                    const pages = doc.getPages();
                    const helveticaFont = await doc.embedFont(StandardFonts.HelveticaBold);
                    const hexColor = watermarkColorInput.value;

                    // Convert hex to rgb
                    const r = parseInt(hexColor.substr(1, 2), 16) / 255;
                    const g = parseInt(hexColor.substr(3, 2), 16) / 255;
                    const b = parseInt(hexColor.substr(5, 2), 16) / 255;
                    const opacity = (parseInt(watermarkOpacityInput ? watermarkOpacityInput.value : 30, 10)) / 100;
                    const angleDeg = parseInt(watermarkAngleInput ? watermarkAngleInput.value : 45, 10);

                    for (let page of pages) {
                        const { width, height } = page.getSize();
                        const fontSize = 56;
                        const textWidth = helveticaFont.widthOfTextAtSize(text, fontSize);

                        let x, y;
                        if (angleDeg === 0) {
                            x = (width - textWidth) / 2;
                            y = (height - fontSize) / 2;
                        } else {
                            const angleInRad = angleDeg * Math.PI / 180;
                            x = width / 2 - (textWidth / 2) * Math.cos(angleInRad) + (fontSize / 2) * Math.sin(angleInRad);
                            y = height / 2 - (textWidth / 2) * Math.sin(angleInRad) - (fontSize / 2) * Math.cos(angleInRad);
                        }

                        page.drawText(text, {
                            x: Math.max(10, x),
                            y: Math.max(10, y),
                            size: fontSize,
                            font: helveticaFont,
                            color: rgb(r, g, b),
                            opacity: opacity,
                            rotate: degrees(angleDeg),
                        });
                    }
                }

                const newPdfBytes = await doc.save();
                const blob = new Blob([newPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Protected_${fileName}`;
                link.click();

                statusMsg.innerText = "Success! Document protected & downloaded.";
                processBtn.innerText = "Protect & Download Document";
                processBtn.disabled = false;

            } catch (err) {
                console.error(err);
                alert("Failed to protect document. See console.");
                processBtn.disabled = false;
                processBtn.innerText = "Protect & Download Document";
            }
        });

    </script>
