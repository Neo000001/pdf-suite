    <div class="workspace">
        <h1>PDF to PowerPoint</h1>
        <p style="color:var(--fg-muted); margin-bottom:1.5rem;">Each PDF page is converted into a slide image. Download

        <div class="upload-box" id="uploadBox">
            <i data-lucide="presentation"></i>
            <h2>Select PDF File</h2>

    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        lucide.createIcons();

        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const actionArea = document.getElementById('actionArea');
        const convertBtn = document.getElementById('convertBtn');
        const downloadPptxBtn = document.getElementById('downloadPptxBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusMsg = document.getElementById('statusMsg');
        const fileInfo = document.getElementById('fileInfo');
        const previewGrid = document.getElementById('previewGrid');

        let pdfBytes = null, fileName = '', slideDataUrls = [], pptxInstance = null;

        uploadBox.addEventListener('click', () => fileInput.click());
        resetBtn.addEventListener('click', () => location.reload());

        fileInput.addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            fileName = file.name;
            pdfBytes = await file.arrayBuffer();
            uploadBox.style.display = 'none';
            actionArea.style.display = 'block';
            fileInfo.innerText = `Selected: ${fileName}`;
            lucide.createIcons();
        });

        convertBtn.addEventListener('click', async () => {
            convertBtn.disabled = true;
            convertBtn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> Converting...';
            previewGrid.innerHTML = '';
            slideDataUrls = [];
            statusMsg.innerText = 'Creating presentation slides...';

            try {
                const doc = await pdfjsLib.getDocument({ data: new Uint8Array(pdfBytes) }).promise;
                const firstPage = await doc.getPage(1);
                const firstVp = firstPage.getViewport({ scale: 1.0 });

                // Initialize genuine PowerPoint generator
                pptxInstance = new PptxGenJS();
                const isWide = firstVp.width >= firstVp.height;
                pptxInstance.layout = isWide ? 'LAYOUT_WIDE' : 'LAYOUT_4x3';

                for (let i = 1; i <= doc.numPages; i++) {
                    statusMsg.innerText = `Processing slide ${i} of ${doc.numPages}...`;
                    const page = (i === 1) ? firstPage : await doc.getPage(i);
                    const vp = page.getViewport({ scale: 2.0 }); // High-res 144 DPI
                    const canvas = document.createElement('canvas');
                    canvas.width = vp.width;
                    canvas.height = vp.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;

                    const dataUrl = canvas.toDataURL('image/png');
                    slideDataUrls.push({ name: `Slide_${i}.png`, dataUrl });

                    // Add slide to genuine PPTX
                    const slide = pptxInstance.addSlide();
                    slide.addImage({
                        data: dataUrl,
                        x: 0,
                        y: 0,
                        w: '100%',
                        h: '100%',
                        sizing: { type: 'contain', w: '100%', h: '100%' }
                    });

                    // Add UI preview card
                    const thumb = document.createElement('div');
                    thumb.className = 'slide-thumb';
                    const tc = document.createElement('canvas');
                    const scale2 = 160 / vp.width;
                    tc.width = vp.width * scale2;
                    tc.height = vp.height * scale2;
                    tc.getContext('2d').drawImage(canvas, 0, 0, tc.width, tc.height);
                    const p = document.createElement('p');
                    p.innerText = `Slide ${i}`;
                    thumb.appendChild(tc);
                    thumb.appendChild(p);
                    previewGrid.appendChild(thumb);
                }

                statusMsg.innerHTML = `<span style="color:#10b981;font-weight:600;">&#10003; PowerPoint Presentation Ready!</span> Generated ${doc.numPages} slides formatted for Microsoft PowerPoint.`;
                convertBtn.style.display = 'none';
                downloadPptxBtn.style.display = 'inline-flex';
                downloadZipBtn.style.display = 'inline-flex';
                lucide.createIcons();

            } catch (err) {
                console.error(err);
                statusMsg.innerText = 'Conversion failed: ' + (err.message || 'Unknown error');
                statusMsg.style.color = '#ef4444';
                convertBtn.disabled = false;
                convertBtn.innerText = 'Try Again';
            }
        });

        // Download real Microsoft PowerPoint (.pptx)
        downloadPptxBtn.addEventListener('click', async () => {
            if (!pptxInstance) return;
            downloadPptxBtn.disabled = true;
            downloadPptxBtn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> Saving PPTX...';

            try {
                const pptxName = fileName.replace(/\.pdf$/i, '') + '.pptx';
                await pptxInstance.writeFile({ fileName: pptxName });
            } catch (e) {
                console.error('PPTX save error:', e);
                alert('Failed to save PowerPoint file: ' + e.message);
            } finally {
                downloadPptxBtn.disabled = false;
                downloadPptxBtn.innerHTML = '<i data-lucide="download"></i> Download Presentation (.pptx)';
                lucide.createIcons();
            }
        });

        // Optional: Download slide images as ZIP
        downloadZipBtn.addEventListener('click', async () => {
            downloadZipBtn.disabled = true;
            downloadZipBtn.innerHTML = '<i data-lucide="loader" style="width:16px;height:16px;animation:spin 1s linear infinite;"></i> Zipping...';

            const zip = new JSZip();
            for (const s of slideDataUrls) {
                const base64 = s.dataUrl.split(',')[1];
                zip.file(s.name, base64, { base64: true });
            }
            const blob = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${fileName.replace(/\.pdf$/i, '')}_SlideImages.zip`;
            a.click();

            downloadZipBtn.disabled = false;
            downloadZipBtn.innerHTML = '<i data-lucide="archive"></i> Download Slides as Images (ZIP)';
            lucide.createIcons();
        });
    </script>
